<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark")
            document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Reseller portal</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --surface: #fff;
        --line: #e7eaf0;
        --ink: #0f172a;
        --muted: #6b7280;
        --accent: #4f46e5;
      }
      html[data-theme="dark"] {
        --bg: #0e1014;
        --surface: #161a22;
        --line: #2a3140;
        --ink: #e8ebf2;
        --muted: #9aa3b4;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, "Segoe UI", Tahoma, sans-serif;
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      .who {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }
      .panel {
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--muted);
      }
      button {
        padding: 10px 14px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <div>
          <h1>Reseller portal</h1>
          <div class="who" id="who"></div>
        </div>
        <button id="logout" type="button">Log out</button>
      </header>
      <section class="panel" aria-live="polite">No accounts assigned.</section>
    </main>
    <script>
      async function loadIdentity() {
        const response = await fetch("/reseller/whoami", {
          credentials: "same-origin",
        });
        if (!response.ok) {
          location.href = "/reseller-login.html";
          return;
        }
        const data = await response.json();
        const reseller = data.reseller || {};
        document.getElementById("who").textContent =
          reseller.displayName || reseller.username || "";
      }
      document.getElementById("logout").addEventListener("click", async () => {
        await fetch("/reseller-logout", {
          method: "POST",
          credentials: "same-origin",
        });
        location.href = "/reseller-login.html";
      });
      loadIdentity();
    </script>
    <script src="/theme.js"></script>
  </body>
</html>
