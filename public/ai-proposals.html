<!DOCTYPE html>
<html lang="en">

<head>
  <script>(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coworker Proposals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#f6f7fb;--surface:#ffffff;--surface-2:#f8fafc;--line:#e7eaf0;--ink:#0f172a;--muted:#6b7280;--accent:#4f46e5;--accent-d:#4338ca;--green:#16a34a;--red:#dc2626;--amber:#d97706;}
    html[data-theme="dark"]{--bg:#0e1014;--surface:#161a22;--surface-2:#1e232e;--line:#2a3140;--ink:#e8ebf2;--muted:#9aa3b4;color-scheme:dark;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:"Inter","Segoe UI",Tahoma,sans-serif;color:var(--ink);background:var(--bg);min-height:100dvh;}
    header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:10;flex-wrap:wrap;}
    header .title{font-weight:700;font-size:15px;}
    header .spacer{flex:1;}
    .btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
    .btn:hover{background:var(--surface-2);}
    .btn.icon{width:38px;height:38px;justify-content:center;padding:0;font-size:16px;}
    .btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
    .btn.run{background:var(--green);color:#fff;border-color:var(--green);}
    .btn.run:hover{filter:brightness(1.05);}
    .btn.danger{color:var(--red);}
    .btn:disabled{opacity:.5;cursor:default;}
    .wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px;}
    .filters{display:flex;gap:8px;margin-bottom:14px;}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;}
    .card h3{font-size:15.5px;margin-bottom:6px;}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
    .chip{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;}
    .chip.exec{color:var(--accent);border-color:var(--accent);}
    .chip.sev-high{color:var(--red);border-color:var(--red);}
    .chip.st-applied{color:var(--green);border-color:var(--green);}
    .chip.st-dismissed{color:var(--muted);}
    .detail{font-size:13.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;overflow-x:auto;}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
    .runlog{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#0b0e14;color:#cfe3ff;border-radius:10px;padding:10px 12px;margin-top:10px;white-space:pre-wrap;max-height:280px;overflow-y:auto;}
    .runlog .ok{color:#7ee787;} .runlog .err{color:#ff7b72;}
    .empty{color:var(--muted);text-align:center;margin-top:14vh;font-size:15px;}
    .empty b{color:var(--ink);font-size:19px;display:block;margin-bottom:6px;}
  </style>
</head>

<body>
  <header>
    <span class="title">🧑‍💻 Coworker Proposals</span>
    <span class="spacer"></span>
    <a class="btn" href="/ai-chat.html">← AI Chat</a>
    <button class="btn icon" id="theme" title="Theme">◐</button>
    <a class="btn" href="/admin.html">Exit</a>
  </header>

  <div class="wrap">
    <div class="filters">
      <button class="btn on" data-f="open">Open</button>
      <button class="btn" data-f="applied">Applied</button>
      <button class="btn" data-f="dismissed">Dismissed</button>
      <span class="spacer"></span>
      <button class="btn icon" id="refresh" title="Refresh">↻</button>
    </div>
    <div id="list"></div>
  </div>

  <script src="/ai-actions.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let filter = "open";
    const esc = (s) => String(s==null?"":s).replace(/[&<>]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

    async function api(method, path, body){
      const r = await fetch(path, { method, headers: body?{"Content-Type":"application/json"}:{}, body: body?JSON.stringify(body):undefined });
      let j={}; try{ j=await r.json(); }catch(e){}
      if(!r.ok) throw new Error(j.message || (method+" "+path+" ("+r.status+")"));
      return j;
    }

    function card(p){
      const exec = p.action && p.action.type;
      const chips = [
        `<span class="chip">${esc(p.kind)}</span>`,
        `<span class="chip sev-${p.severity}">${esc(p.severity)}</span>`,
        exec ? `<span class="chip exec">⚡ ${esc(p.action.type)}</span>` : `<span class="chip">advisory</span>`,
        p.status!=="open" ? `<span class="chip st-${p.status}">${esc(p.status)}</span>` : "",
        ...(p.targets||[]).map(t=>`<span class="chip">${esc(t)}</span>`),
      ].join("");
      let actions = "";
      if(p.status==="open"){
        if(exec && p.action.type==="webbot_split")
          actions += `<button class="btn run" data-run="${p.id}">✓ Approve &amp; run</button>`;
        else
          actions += `<button class="btn on" data-done="${p.id}">✓ Mark done</button>`;
        actions += `<button class="btn danger" data-dismiss="${p.id}">Dismiss</button>`;
      } else {
        actions += `<button class="btn" data-reopen="${p.id}">Reopen</button>`;
      }
      return `<div class="card" data-id="${p.id}">
        <h3>${esc(p.title)}</h3>
        <div class="chips">${chips}</div>
        <div class="detail">${esc(p.detail)}</div>
        <div class="row">${actions}</div>
        <div class="runlog" id="log-${p.id}" hidden></div>
      </div>`;
    }

    window.__actions = {};
    async function load(){
      try{
        const { proposals } = await api("GET", `/ai-chat/proposals?status=${filter}`);
        window.__actions = {}; for(const p of proposals) if(p.action) window.__actions[p.id]=p.action;
        $("list").innerHTML = proposals.length ? proposals.map(card).join("")
          : `<div class="empty"><b>Nothing here</b>${filter==="open"?"When the coworker recommends something, it shows up here to approve.":"No "+filter+" proposals."}</div>`;
      }catch(e){ $("list").innerHTML = `<div class="empty" style="color:var(--red)">${esc(e.message)}</div>`; }
    }

    function logTo(id, msg, cls){
      const el = $("log-"+id); if(!el) return; el.hidden=false;
      el.innerHTML += `<div class="${cls||''}">${esc(msg)}</div>`; el.scrollTop = el.scrollHeight;
    }

    async function approveRun(id, btn){
      const action = window.__actions[id];
      if(!action) return;
      if(!confirm("Approve & run this action now? It will release and recreate the bot on the Pi.")) return;
      btn.disabled = true; btn.textContent = "Running…";
      try{
        await window.AIActions.run(action, (m,c)=>logTo(id, m, c));
        await api("POST", `/ai-chat/proposals/${id}/status`, { status: "applied" });
        logTo(id, "Marked applied.", "ok");
        setTimeout(load, 1200);
      }catch(e){
        logTo(id, "⚠ "+e.message, "err");
        logTo(id, "Left OPEN so you can retry or finish it by hand on /webbot-farm.html.", "err");
        btn.disabled=false; btn.textContent="✓ Approve & run";
      }
    }

    // ---- events ----
    document.querySelectorAll(".filters .btn[data-f]").forEach(b=>b.addEventListener("click", ()=>{
      filter=b.dataset.f; document.querySelectorAll(".filters .btn[data-f]").forEach(x=>x.classList.toggle("on", x===b)); load();
    }));
    $("refresh").addEventListener("click", load);
    $("theme").addEventListener("click", ()=>{ const d=document.documentElement.getAttribute("data-theme")==="dark"; if(d){document.documentElement.removeAttribute("data-theme");localStorage.setItem("theme","light");}else{document.documentElement.setAttribute("data-theme","dark");localStorage.setItem("theme","dark");} });
    $("list").addEventListener("click", async (e)=>{
      const run=e.target.closest("[data-run]"), done=e.target.closest("[data-done]"), dis=e.target.closest("[data-dismiss]"), re=e.target.closest("[data-reopen]");
      try{
        if(run) return approveRun(run.dataset.run, run);
        if(done){ await api("POST",`/ai-chat/proposals/${done.dataset.done}/status`,{status:"applied"}); load(); }
        if(dis){ await api("POST",`/ai-chat/proposals/${dis.dataset.dismiss}/status`,{status:"dismissed"}); load(); }
        if(re){ await api("POST",`/ai-chat/proposals/${re.dataset.reopen}/status`,{status:"open"}); load(); }
      }catch(err){ alert(err.message); }
    });

    load();
  </script>
</body>

</html>
