<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f1e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kanji" />
  <meta name="description" content="Kanji and word practice: swipe cards, quizzes and spaced review." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>Kanji Practice</title>
  <link rel="stylesheet" href="kanji.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <a class="icon-btn ghost" href="/admin.html" aria-label="Back to the site" title="Back to the site">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="brand"><span class="seal" aria-hidden="true">漢</span><b>Kanji</b><span class="brand-sub" id="brandSub"></span></div>
      <span class="net" id="net" hidden>Offline</span>
      <button class="icon-btn ghost" id="btnSettings" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabs" aria-label="Sections">
      <a href="#home" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>
        <span>Today</span>
      </a>
      <a href="#cards" data-tab="cards">
        <svg viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="14" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v12"/></svg>
        <span>Cards</span>
      </a>
      <a href="#quiz" data-tab="quiz">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6"/><path d="M12 17.2h.01"/></svg>
        <span>Quiz</span>
      </a>
      <a href="#deck" data-tab="deck">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Deck</span>
      </a>
    </nav>
  </div>

  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
