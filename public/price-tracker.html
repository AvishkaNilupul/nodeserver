<!DOCTYPE html>
<html lang="en">

<head>
<script>(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Price tracker | RedeemHub</title>
<style>
  :root{--bg:#f6f7fb;--surface:#ffffff;--surface-2:#f8fafc;--line:#e7eaf0;--ink:#0f172a;--muted:#6b7280;--accent:#4f46e5;--accent2:#6366f1;--green:#059669;--red:#dc2626;--yellow:#b45309;}
  html[data-theme="dark"]{--bg:#0e1014;--surface:#161a22;--surface-2:#1e232e;--line:#2a3140;--ink:#e8ebf2;--muted:#9aa3b4;--green:#34d399;--red:#f87171;--yellow:#fbbf24;color-scheme:dark;}
  html[data-theme="dark"] .nav .links a.active{background:rgba(99,102,241,0.20);}
  html[data-theme="dark"] .pill.s-ok{background:rgba(52,211,153,.14);}
  html[data-theme="dark"] .pill.s-warn{background:rgba(251,191,36,.14);}
  html[data-theme="dark"] .pill.s-fail{background:rgba(248,113,113,.14);}
  html[data-theme="dark"] .pill.s-unknown{background:rgba(154,163,180,.12);}
  html[data-theme="dark"] .tab.on{background:rgba(99,102,241,.20);}
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Inter","Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; overflow:hidden; }

  .nav { width:236px; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; flex-shrink:0; }
  .nav .brand { display:flex; align-items:center; gap:10px; padding:18px 20px; border-bottom:1px solid var(--line); }
  .nav .brand .mark { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--accent2),var(--accent)); display:grid; place-items:center; box-shadow:0 6px 14px rgba(79,70,229,0.32); }
  .nav .brand b { font-size:15px; font-weight:700; line-height:1.15; }
  .nav .brand b span { display:block; font-size:10.5px; color:var(--muted); font-weight:500; }
  .nav .links { padding:12px; flex:1; display:flex; flex-direction:column; gap:4px; overflow-y:auto; }
  .nav .links a { display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:10px; color:var(--muted); text-decoration:none; font-size:14px; font-weight:500; }
  .nav .links a:hover { background:var(--surface-2); }
  .nav .links a.active { background:#eef2ff; color:var(--accent); font-weight:600; }
  .nav .me { border-top:1px solid var(--line); padding:14px; display:flex; align-items:center; gap:10px; }
  .nav .me .av { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#34d399,#10b981); display:grid; place-items:center; color:#fff; font-weight:700; font-size:13px; flex-shrink:0; }
  .nav .me .who { line-height:1.2; min-width:0; }
  .nav .me .who b { font-size:13.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:84px; }
  .nav .me .who span { display:block; font-size:11px; color:var(--muted); }
  .nav .me .actions { margin-left:auto; display:flex; gap:6px; }
  .nav .me .logout { width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--muted); display:grid; place-items:center; cursor:pointer; }

  .page { flex:1; overflow-y:auto; padding:26px 30px 64px; min-width:0; -webkit-overflow-scrolling:touch; }
  h1 { font-size:22px; font-weight:800; }
  .sub { color:var(--muted); font-size:13.5px; margin-top:4px; line-height:1.45; }
  .head { display:flex; align-items:flex-start; gap:18px; flex-wrap:wrap; margin:0 0 18px; }
  .head-actions { margin-left:auto; display:flex; gap:8px; align-items:center; }

  button { border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); padding:9px 14px; cursor:pointer; font:inherit; font-size:13.5px; }
  button:hover { border-color:var(--accent); }
  button.primary { color:#fff; border-color:var(--accent); background:var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  a.plain { color:var(--accent); text-decoration:none; }

  .pill { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:3px 9px; font-size:11px; font-weight:700; border:1px solid transparent; white-space:nowrap; }
  .pill.s-ok { color:var(--green); background:#ecfdf5; }
  .pill.s-warn { color:var(--yellow); background:#fffbeb; }
  .pill.s-fail { color:var(--red); background:#fef2f2; }
  .pill.s-unknown { color:var(--muted); background:#f3f4f6; border-style:dashed; border-color:var(--line); }

  /* ---------------------------- market cards ---------------------------- */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:14px; }
  .mcard { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:15px 16px; cursor:pointer; display:flex; flex-direction:column; gap:11px; text-align:left; width:100%; }
  .mcard:hover { border-color:var(--accent); }
  .mcard .top { display:flex; align-items:center; gap:9px; }
  .mcard .nm { font-size:15.5px; font-weight:750; text-transform:capitalize; }
  .mcard .chev { margin-left:auto; color:var(--muted); flex-shrink:0; }
  .mcard .money { font-size:24px; font-weight:800; letter-spacing:-.4px; line-height:1; }
  .mcard .money small { font-size:12px; font-weight:600; color:var(--muted); margin-left:5px; letter-spacing:0; }
  .mcard .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .mcard .stat { background:var(--surface-2); border-radius:9px; padding:7px 9px; }
  .mcard .stat b { display:block; font-size:15px; font-weight:750; line-height:1.2; }
  .mcard .stat span { font-size:10.5px; color:var(--muted); }
  .mcard .basis { font-size:11px; color:var(--muted); line-height:1.4; }

  /* ------------------------------ detail -------------------------------- */
  .back { display:inline-flex; align-items:center; gap:7px; color:var(--muted); background:none; border:none; padding:8px 0; font-size:13.5px; cursor:pointer; }
  .back:hover { color:var(--accent); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:14px 0 16px; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 13px; }
  .kpi b { display:block; font-size:19px; font-weight:800; line-height:1.2; }
  .kpi span { font-size:11.5px; color:var(--muted); }

  .tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:12px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:0 0 auto; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 15px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .tab.on { background:#eef2ff; color:var(--accent); border-color:var(--accent); }

  .basisbar { font-size:12px; color:var(--muted); background:var(--surface-2); border:1px dashed var(--line); border-radius:10px; padding:9px 12px; margin-bottom:12px; line-height:1.45; }

  .rows { display:flex; flex-direction:column; gap:8px; }
  .row { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .row .r1 { display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
  .row .r1 .t { font-weight:650; font-size:14px; line-height:1.35; word-break:break-word; }
  .row .r1 .amt { margin-left:auto; font-weight:750; font-size:14px; white-space:nowrap; }
  .row .r2 { margin-top:5px; font-size:12px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .row .err { margin-top:7px; font-size:12px; color:var(--red); background:rgba(220,38,38,.06); border-radius:8px; padding:7px 9px; line-height:1.45; word-break:break-word; }
  /* A reason, not a fault. "Missing because the reserve floor was reached" is
     the buffer working as designed, and painting it red like .err would teach
     the operator to ignore the rows that ARE faults. */
  .row .why { margin-top:7px; font-size:12px; color:var(--muted); background:var(--surface-2); border:1px dashed var(--line); border-radius:8px; padding:7px 9px; line-height:1.45; word-break:break-word; }
  .row .kpis { margin:10px 0 2px; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; }
  .oid { color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:2px; word-break:break-all; }
  .empty { text-align:center; color:var(--muted); font-size:13.5px; padding:34px 16px; background:var(--surface); border:1px dashed var(--line); border-radius:12px; line-height:1.5; }
  .more { width:100%; margin-top:10px; padding:12px; }
  .sentinel { height:1px; }

  /* --------------------------- order trail ------------------------------ */
  .sheet { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; z-index:80; align-items:flex-end; justify-content:center; }
  .sheet.on { display:flex; }
  .sheet .inner { background:var(--surface); width:100%; max-width:620px; max-height:86vh; border-radius:16px 16px 0 0; display:flex; flex-direction:column; }
  .sheet .sh { padding:15px 17px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .sheet .sh b { font-size:15px; font-weight:750; }
  .sheet .sb { padding:15px 17px calc(24px + env(safe-area-inset-bottom)); overflow-y:auto; }
  .tl { position:relative; padding-left:20px; }
  .tl::before { content:""; position:absolute; left:5px; top:5px; bottom:5px; width:2px; background:var(--line); }
  .tl .ev { position:relative; padding-bottom:15px; }
  .tl .ev::before { content:""; position:absolute; left:-19px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--accent); border:2px solid var(--surface); }
  .tl .ev.bad::before { background:var(--red); }
  .tl .ev .k { font-weight:700; font-size:13px; }
  .tl .ev .w { font-size:11.5px; color:var(--muted); }
  .tl .ev .d { font-size:12.5px; margin-top:3px; line-height:1.45; word-break:break-word; }

  @media (max-width:768px) {
    .page { padding:14px 14px calc(72px + env(safe-area-inset-bottom)); }
    h1 { font-size:19px; }
    .sub { font-size:12.5px; }
    .grid { grid-template-columns:1fr; gap:11px; }
    .kpis { grid-template-columns:repeat(2,1fr); }
    /* Tap targets, not mouse targets. */
    .tab { padding:10px 16px; font-size:13.5px; }
    .mcard { padding:14px; }
    .row { padding:13px 14px; }
    .head-actions { width:100%; }
    .head-actions button { flex:1; padding:11px 14px; }
  }

  /* ------------------------------ price tracker ------------------------------ */
  .insights { display:flex; flex-direction:column; gap:8px; margin:0 0 18px; }
  .insight { background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:12px; padding:11px 14px; }
  .insight.warn { border-left-color:var(--yellow); }
  .insight.opportunity { border-left-color:var(--green); }
  .insight.info { border-left-color:var(--accent2); }
  .insight b { font-size:13.5px; display:block; margin-bottom:3px; }
  .insight span { font-size:12.5px; color:var(--muted); line-height:1.5; display:block; }
  .vgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .vcard { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .vcard .top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .vcard .nm { font-size:15.5px; font-weight:750; }
  .vcard .big { font-size:23px; font-weight:800; letter-spacing:-.4px; line-height:1; }
  .vcard .big small { font-size:11.5px; font-weight:600; color:var(--muted); margin-left:5px; letter-spacing:0; }
  .vcard .mini { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  .vcard .mini div { background:var(--surface-2); border-radius:9px; padding:6px 9px; }
  .vcard .mini b { display:block; font-size:14px; font-weight:750; }
  .vcard .mini span { font-size:10.5px; color:var(--muted); }
  .vcard .note { font-size:11.5px; color:var(--muted); line-height:1.45; }
  .pill.s-info { color:var(--accent); background:#eef2ff; }
  html[data-theme="dark"] .pill.s-info { background:rgba(99,102,241,.18); }
  .ctl { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 12px; }
  .ctl select, .ctl input { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:9px; padding:9px 11px; font:inherit; font-size:13.5px; min-width:0; }
  .ctl input[type=search] { flex:1 1 180px; }
  table.curve { width:100%; border-collapse:collapse; font-size:12.5px; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  table.curve th { text-align:right; font-weight:650; color:var(--muted); font-size:11px; padding:8px 9px; background:var(--surface-2); white-space:nowrap; }
  table.curve td { text-align:right; padding:8px 9px; border-top:1px solid var(--line); white-space:nowrap; }
  table.curve th:first-child, table.curve td:first-child { text-align:left; }
  table.curve tr.best td { background:rgba(5,150,105,.09); font-weight:650; }
  table.curve tr.thin td { opacity:.55; }
  .scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .bar { display:inline-block; height:7px; border-radius:4px; background:var(--accent2); vertical-align:middle; }
  .bar.range { background:rgba(99,102,241,.25); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
  .chip { font-size:11.5px; border:1px solid var(--line); background:var(--surface-2); border-radius:8px; padding:4px 8px; line-height:1.3; }
  .chip b { font-weight:700; }
  .chip.sold { border-color:var(--green); }
  .arrow { color:var(--muted); }
  .good { color:var(--green); } .bad { color:var(--red); }
  .row.clickable { cursor:pointer; } .row.clickable:hover { border-color:var(--accent); }
  .gsum { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; margin:0 0 12px; }
  .gsum div { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 11px; }
  .gsum b { display:block; font-size:16px; font-weight:800; } .gsum span { font-size:11px; color:var(--muted); }
  .pill.s-more { color:var(--green); background:#ecfdf5; } .pill.s-less { color:var(--yellow); background:#fffbeb; }
  html[data-theme="dark"] .pill.s-more { background:rgba(52,211,153,.14); } html[data-theme="dark"] .pill.s-less { background:rgba(251,191,36,.14); }
  .kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin:8px 0 12px; }
  .kv div { background:var(--surface-2); border-radius:9px; padding:7px 10px; } .kv b { display:block; font-size:14px; } .kv span { font-size:11px; color:var(--muted); }
  .flagbox { font-size:12px; line-height:1.45; border-left:3px solid var(--line); background:var(--surface-2); border-radius:6px; padding:7px 10px; margin:6px 0; }
  .flagbox.warn { border-left-color:var(--yellow); } .flagbox.opportunity { border-left-color:var(--green); } .flagbox.info { border-left-color:var(--accent2); }
  table.pm { width:100%; border-collapse:collapse; font-size:12px; } table.pm th { text-align:left; color:var(--muted); font-weight:650; font-size:10.5px; padding:6px 7px; background:var(--surface-2); white-space:nowrap; }
  table.pm td { padding:7px; border-top:1px solid var(--line); vertical-align:top; } table.pm td small { color:var(--muted); display:block; font-size:10.5px; line-height:1.35; }
  h4.sec { font-size:13px; margin:16px 0 6px; }

</style>
</head>

<body>
  <aside class="nav">
    <div class="brand">
      <span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 8.5 12 15 22 8.5 12 2"></polygon></svg></span>
      <b>RedeemHub<span>Admin console</span></b>
    </div>
    <nav class="links"></nav>
    <div class="me">
      <div class="av" id="meAvatar">--</div>
      <div class="who"><b id="meName">Admin</b><span id="meRole">...</span></div>
      <div class="actions">
        <button class="logout" data-theme-toggle onclick="toggleTheme()" title="Toggle dark mode" aria-pressed="false">☾</button>
        <button class="logout" id="logoutBtn" title="Log out">⎋</button>
      </div>
    </div>
  </aside>

  <main class="page" id="page"></main>

  <div class="sheet" id="sheet"><div class="inner">
    <div class="sh"><b id="sheetTitle">Set</b><button style="margin-left:auto" id="sheetClose">Close</button></div>
    <div class="sb" id="sheetBody"></div>
  </div></div>

  <script src="/theme.js"></script>
  <script src="/admin-nav.js"></script>
  <script>
  (function () {
    "use strict";
    // Everything rendered here is marketplace-supplied text (offer titles, order
    // ids). One unescaped value is an XSS hole on a superadmin page.
    function esc(v) {
      return String(v == null ? "" : v)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function money(n) { return "$" + (Number(n) || 0).toFixed(2); }
    function pct(n) { return Math.round((Number(n) || 0) * 100) + "%"; }
    function ago(d) {
      if (!d) return "never";
      var s = Math.max(0, (Date.now() - new Date(d).getTime()) / 1000);
      if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min ago";
      if (s < 86400) return Math.round(s / 3600) + "h ago";
      return Math.round(s / 86400) + "d ago";
    }
    function day(d) { return d ? String(d).slice(0, 10) : "—"; }
    async function api(path) {
      // The Refresh button asks for a rebuild once, on whichever tab is showing.
      if (state.forceNext && path.indexOf("/api/price-tracker/") === 0) {
        path += (path.indexOf("?") < 0 ? "?" : "&") + "force=1";
        state.forceNext = false;
      }
      var r = await fetch(path, { credentials: "same-origin", headers: { Accept: "application/json" } });
      if (r.status === 401 || r.status === 403) throw new Error("Not signed in as a superadmin with 2FA.");
      var j = await r.json().catch(function () { return null; });
      if (!r.ok || !j || j.success === false) throw new Error((j && j.message) || "HTTP " + r.status);
      return j;
    }

    var page = document.getElementById("page");
    var TABS = [["games", "Games"], ["market", "Market radar"], ["overview", "Overview"], ["curve", "Price curve"], ["sets", "Same items"], ["advice", "Advice"], ["sales", "Sales ledger"], ["suggest", "Suggest"]];
    var MARKETS = ["gameflip", "ggsel", "eldorado", "g2g", "playerauctions", "zeusx", "digiseller"];
    var state = { tab: (location.hash || "#games").slice(1), overview: null };
    if (!TABS.some(function (t) { return t[0] === state.tab; })) state.tab = "games";

    // Every shell() starts a new render. A response that arrives after the user
    // has moved to another tab (or changed a filter) must not write into the new
    // DOM: it checks its generation and drops out instead.
    function shell(inner) {
      state.gen = (state.gen || 0) + 1;
      var gen = state.gen;
      page.innerHTML =
        '<div class="head"><div><h1>Price tracker</h1>' +
        '<div class="sub">What each market really pays for the same items, whether lower prices really sell more, and what each listing should cost. ' +
        'Read-only — nothing here lists, delists or reprices, and it never calls a marketplace.</div></div>' +
        '<div class="head-actions"><button id="refreshBtn">Refresh</button></div></div>' +
        '<div class="tabs">' + TABS.map(function (t) {
          return '<button class="tab' + (t[0] === state.tab ? " on" : "") + '" data-tab="' + t[0] + '">' + t[1] + "</button>";
        }).join("") + "</div>" + inner;
      page.querySelector("#refreshBtn").onclick = function () { state.overview = null; state.forceNext = true; render(true); };
      Array.prototype.forEach.call(page.querySelectorAll(".tab"), function (b) {
        b.onclick = function () { state.tab = b.getAttribute("data-tab"); location.hash = state.tab; render(); };
      });
      return gen;
    }
    function stale(g) { return g !== state.gen; }
    function fail(e) { shell('<div class="empty">' + esc(e.message) + "</div>"); }
    function marketOptions(sel, any) {
      return (any ? '<option value="">All markets</option>' : "") + MARKETS.map(function (m) {
        return '<option value="' + m + '"' + (m === sel ? " selected" : "") + ">" + m + "</option>";
      }).join("");
    }

    /* ----------------------------- overview ----------------------------- */
    async function getOverview(force) {
      if (!state.overview || force) state.overview = await api("/api/price-tracker/overview");
      return state.overview;
    }
    function venueCard(v, fees) {
      var f = fees[v.market] || {};
      var gap = v.askVsRealisedPct;
      return '<div class="vcard"><div class="top"><span class="nm">' + esc(v.label) + "</span>" +
        (v.blocked ? '<span class="pill s-fail">blocked</span>' : "") +
        '<span class="pill ' + (f.verified ? "s-ok" : "s-unknown") + '" title="' + esc(f.source) + '">' + esc(f.feePct) + "% fee" + (f.verified ? "" : " · assumed") + "</span></div>" +
        (v.realised.n
          ? '<div class="big">' + money(v.realised.median) + "<small>median realised · " + v.realised.n + " sales</small></div>"
          : '<div class="big">—<small>no priced sales recorded</small></div>') +
        '<div class="mini"><div><b>' + money(v.realised.p75) + "</b><span>p75 paid</span></div>" +
        "<div><b>" + money(v.grossUsd) + "</b><span>gross</span></div>" +

        '<select id="mfl"><option value="">Any flag</option><option value="collector-niche">Big collections sell high</option><option value="not-selling">Rivals sell, we do not list</option><option value="undercut">Our listings undercut</option><option value="price-war">Price war</option><option value="fast">Sells fast</option><option value="slow">Sells slowly</option><option value="crowded">Crowded</option><option value="alone">No rivals</option><option value="stale-scan">Market not re-read lately</option></select>';
      if (f.view === "rivals" || f.view === "sales" || f.view === "undercuts") extra += '<select id="mmk">' + mkOpts(f.market, true) + "</select>";
      if (f.view === "sales") extra += '<select id="mou"><option value="0">rivals only</option><option value="">rivals + ours</option><option value="1">ours only</option></select><select id="mki"><option value="drops">drop bundles</option><option value="farm">rent-farm windows</option><option value="">both</option></select>';
      if (f.view === "undercuts") extra += '<select id="mor"><option value="">auto + manual</option><option value="auto">auto rows</option><option value="manual">manual rows</option></select>';
      if (f.view !== "overview") extra += '<input id="mq" type="search" placeholder="Search" value="' + esc(f.q) + '">';
      var g = shell('<div class="ctl">' + views + extra + '</div><div id="mk"><div class="empty">Loading…</div></div>');
      var bind = function (id, key) { var el = page.querySelector("#" + id); if (!el) return; el.value = f[key]; el.onchange = function () { f[key] = el.value; f.offset = 0; renderMarket(); }; };
      bind("mv", "view"); bind("md", "days"); bind("mso", "sort"); bind("mfl", "flag"); bind("mmk", "market"); bind("mou", "ours"); bind("mki", "kind"); bind("mor", "origin");
      var mq = page.querySelector("#mq"), t; if (mq) mq.oninput = function () { clearTimeout(t); t = setTimeout(function () { f.q = mq.value; f.offset = 0; renderMarket(); }, 350); };
      var box = function () { return page.querySelector("#mk"); };
      var pager = function (j, size) {
        return '<div class="ctl" style="margin-top:12px">' + (f.offset > 0 ? '<button id="pv">← Previous</button>' : "") + (f.offset + size < j.total ? '<button id="nx">Next →</button>' : "") + '<span class="sub">' + j.total + "</span></div>";
      };
      var wirePager = function (size) {
        var nx = page.querySelector("#nx"), pv = page.querySelector("#pv");
        if (nx) nx.onclick = function () { f.offset += size; renderMarket(); };
        if (pv) pv.onclick = function () { f.offset = Math.max(0, f.offset - size); renderMarket(); };
      };
      var days = "days=" + encodeURIComponent(f.days);
      if (f.view === "overview") {
        var o = await api("/api/price-tracker/market/overview?" + days);
        if (stale(g)) return;
        var c = o.coverage;
        var tr = o.truncated || {};
        var cards = MK_MARKETS.map(function (m) {
          var v = o.markets[m] || {};
          return '<div class="vcard"><div class="top"><span class="nm">' + esc(m) + "</span>" + (m === "gameflip" ? '<span class="pill s-ok">dated sales</span>' : '<span class="pill s-unknown">counter rises</span>') + "</div>" +
            (v.sold && v.sold.n ? '<div class="big">' + money(v.sold.median) + "<small>median paid to rivals · " + v.sold.n + " sales</small></div>" : '<div class="big">—<small>no rival sale recorded yet</small></div>') +
            '<div class="mini"><div><b>' + (v.units || 0) + "</b><span>units sold by rivals</span></div><div><b>" + hrs(v.medianTtsHours) + "</b><span>time to sell</span></div><div><b>" + (v.liveRivals || 0) + "</b><span>live rival listings</span></div>" +
            "<div><b>" + (v.liveSellers || 0) + "</b><span>rival sellers</span></div><div><b>" + (v.oursLive || 0) + "</b><span>our listings seen</span></div><div><b>" + (v.oursSold || 0) + "</b><span>our sales seen</span></div></div></div>";
        }).join("");
        var tg = o.topGames.map(mkGameRow).join("");
        var tu = o.topUndercuts.map(undercutRow).join("");
        var ts = o.topSellers.map(function (s) { return '<div class="row"><div class="r1"><span class="t">' + esc(s.label) + '</span><span class="amt">' + s.units + " sold</span></div><div class=\"r2\"><span class=\"pill s-info\">" + esc(s.market) + "</span><span>median " + (s.medianPrice != null ? money(s.medianPrice) : "—") + "</span><span>" + money(s.revenueUsd) + " turnover</span><span>" + s.games + " games · " + s.live + " live</span>" + (s.ratings != null ? "<span>" + s.ratings + " ratings</span>" : "") + "</div></div>"; }).join("");
        var mv = o.recentMoves.map(moveRow).join("");
        box().innerHTML = radarLine(o.radar) +
          '<div class="basisbar">What OTHER sellers\' buyers actually paid on the three public markets, who the rivals are, and where our live listings stand. ' + c.gamesWithData + " games with data · " + c.salesStored + " sales and " + c.rivalsStored + " rival listings stored · research covers " + c.researchGames + " games (" + c.researchFresh24h + " scanned in the last 24 h)" +
          (c.firstRecordAt ? " · recording since " + esc(day(c.firstRecordAt)) : "") + (tr.sales || tr.rivals ? ' · <span class="bad">the read was truncated: older data is not shown</span>' : "") + ". Built " + esc(ago(o.generatedAt)) + ". Read-only: nothing here changes a price.</div>" +
          (c.gamesWithData ? '<div class="vgrid">' + cards + "</div>" : '<div class="empty">No market data yet. Once recording is on, every research scan (about 400 a day) adds what it saw; Gameflip\'s sold feed reaches about three weeks back on the first scan.</div>') +
          (tg ? '<h4 class="sec">Busiest games (' + o.counts.games + " in total)</h4><div class=\"rows\">" + tg + "</div>" : "") +
          (tu ? '<h4 class="sec">Our listings with a cheaper comparable rival (' + o.counts.undercuts + ")</h4><div class=\"rows\">" + tu + "</div>" : "") +
          (ts ? '<h4 class="sec">Top rival sellers</h4><div class="rows">' + ts + "</div>" : "") +
          (mv ? '<h4 class="sec">Rival price moves this week</h4><div class="rows">' + mv + "</div>" : "");
        Array.prototype.forEach.call(page.querySelectorAll("[data-mkey]"), function (r) { r.onclick = function () { openMarketGame(r.getAttribute("data-mkey")); }; });
        return;
      }
      if (f.view === "games") {
        var j = await api("/api/price-tracker/market/games?" + days + "&sort=" + encodeURIComponent(f.sort) + "&flag=" + encodeURIComponent(f.flag) + "&q=" + encodeURIComponent(f.q) + "&limit=20&offset=" + f.offset);
        if (stale(g)) return;
        box().innerHTML = '<div class="basisbar">Per game, across Gameflip, GGSel and Plati: units rivals sold, what their buyers paid by size, how fast Gameflip listings sold, and how crowded it is. Rates use only the days each market was actually watched.</div>' +
          (j.rows.length ? '<div class="rows">' + j.rows.map(mkGameRow).join("") + "</div>" : '<div class="empty">Nothing matches.</div>') + pager(j, 20);
        wirePager(20);
        Array.prototype.forEach.call(page.querySelectorAll("[data-mkey]"), function (r) { r.onclick = function () { openMarketGame(r.getAttribute("data-mkey")); }; });
        return;
      }
      if (f.view === "rivals") {
        var jr = await api("/api/price-tracker/market/rivals?" + days + "&market=" + encodeURIComponent(f.market) + "&q=" + encodeURIComponent(f.q) + "&limit=40&offset=" + f.offset);
        if (stale(g)) return;
        box().innerHTML = '<div class="basisbar">Every seller with a sale in the window or a live listing, ranked by units sold. Reputation is on each market\'s own scale.</div>' +
          (jr.rows.length ? '<div class="scroll"><table class="pm"><tr><th>seller</th><th>market</th><th>units</th><th>median price</th><th>turnover</th><th>games</th><th>live</th><th>reputation</th></tr>' + jr.rows.map(function (s) {
            return "<tr><td><b>" + esc(s.label) + "</b></td><td>" + esc(s.market) + "</td><td>" + s.units + "</td><td>" + (s.medianPrice != null ? money(s.medianPrice) : "—") + "</td><td>" + money(s.revenueUsd) + "</td><td>" + s.games + "</td><td>" + s.live + "</td><td>" + (s.score != null ? esc(Math.round(s.score * 100) / 100) : "—") + (s.ratings != null ? "<small>" + s.ratings + " ratings</small>" : "") + "</td></tr>";
          }).join("") + "</table></div>" : '<div class="empty">Nothing matches.</div>') + pager(jr, 40);
        wirePager(40);
        return;
      }
      if (f.view === "sales") {
        var js = await api("/api/price-tracker/market/sales?" + days + "&market=" + encodeURIComponent(f.market) + "&ours=" + encodeURIComponent(f.ours) + "&kind=" + encodeURIComponent(f.kind) + "&q=" + encodeURIComponent(f.q) + "&limit=40&offset=" + f.offset);
        if (stale(g)) return;
        box().innerHTML = '<div class="basisbar">Newest first. Gameflip rows are individual sold listings with the time they took to sell; GGSel / Plati rows are rises of a product\'s sold counter between two scans (units in that window, at the price seen).</div>' +
          (js.rows.length ? '<div class="rows">' + js.rows.map(function (x) {
            return '<div class="row"><div class="r1"><span class="t">' + esc(x.title) + '</span><span class="amt">' + money(x.priceUsd) + (x.units > 1 ? " × " + x.units : "") + "</span></div>" +
              '<div class="r2"><span class="pill s-info">' + esc(x.market) + "</span>" + (x.ours ? '<span class="pill s-ok">ours</span>' : "") + (x.kind === "farm" ? '<span class="pill s-unknown">rent-farm</span>' : "") +
              "<span>" + esc(x.game) + "</span><span>" + esc(day(x.soldAt)) + "</span><span>" + (x.itemCount ? x.itemCount + " items" : "size not stated") + "</span>" + (x.ttsHours != null ? "<span>sold after " + hrs(x.ttsHours) + "</span>" : "") + "<span>" + esc(x.seller) + "</span></div></div>";
          }).join("") + "</div>" : '<div class="empty">Nothing matches.</div>') + pager(js, 40);
        wirePager(40);
        return;
      }
      var ju = await api("/api/price-tracker/market/undercuts?" + days + "&market=" + encodeURIComponent(f.market) + "&origin=" + encodeURIComponent(f.origin) + "&q=" + encodeURIComponent(f.q) + "&limit=30&offset=" + f.offset);
      if (stale(g)) return;
      box().innerHTML = '<div class="basisbar">Our LIVE listings that have a cheaper rival for the same kind and size of product on the same market, as the radar last saw it (Gameflip rivals within 3 days, GGSel within 7). Bulk packs and rent-farm windows are left out (different products). Cheaper is not automatically better: compare with what rivals\' buyers actually paid. Advice only — manual listings are never repriced automatically.</div>' +
        (ju.rows.length ? '<div class="rows">' + ju.rows.map(undercutRow).join("") + "</div>" : '<div class="empty">No undercut listings.</div>') + pager(ju, 30);
      wirePager(30);
    }
    async function openMarketGame(key) {
      var tok = (state.sheetTok = (state.sheetTok || 0) + 1);
      openSheet("Loading…", '<div class="empty">Loading…</div>');
      try {
        var j = await api("/api/price-tracker/market/game/" + encodeURIComponent(key) + "?days=" + encodeURIComponent((state.mk && state.mk.days) || "30"));
        if (tok !== state.sheetTok) return;
        var g = j.game;
        var flags = (g.flags || []).map(function (fl) { return '<div class="flagbox ' + (fl.id === "price-war" || fl.id === "undercut" || fl.id === "slow" || fl.id === "crowded" ? "warn" : "opportunity") + '">' + esc(fl.text) + "</div>"; }).join("");
        var kv = '<div class="kv"><div><b>' + g.units + "</b><span>units sold by rivals (" + j.windowDays + " d)</span></div><div><b>" + (g.perWeek == null ? "—" : g.perWeek) + "</b><span>per week" + (g.perWeek == null ? " (after 2 days of watching)" : g.ratePartial ? " (newest market not rated yet)" : "") + "</span></div><div><b>" + (g.realised.n ? money(g.realised.median) : "—") + "</b><span>median paid, all sizes (see By size)</span></div>" +
          "<div><b>" + hrs(g.medianTtsHours) + "</b><span>sold listings took (Gameflip)</span></div><div><b>" + g.rivalsLive + " / " + g.rivalSellers + "</b><span>live rival listings / sellers</span></div><div><b>" + g.oursLive + " / " + g.oursSold + "</b><span>ours seen live / sold</span></div><div><b>" + (g.oursListed || 0) + "</b><span>our live listings (Gameflip + GGSel)</span></div></div>";
        var mrows = Object.keys(g.byMarket).map(function (m) {
          var v = g.byMarket[m];
          if (!(v.units || v.live || v.oursLive || v.oursSold)) return "";
          return "<tr><td><b>" + esc(m) + "</b></td><td>" + v.units + (v.perWeek != null ? "<small>" + v.perWeek + "/wk over " + v.observedDays + " d</small>" : v.observedDays != null ? "<small>watched " + v.observedDays + " d — no rate yet</small>" : "") + "</td><td>" + stats(v.sold) + "</td><td>" + hrs(v.medianTtsHours) + "</td><td>" + v.live + " (" + v.liveSellers + " sellers)<small>ask " + stats(v.asking) + (v.farmLive ? " · + " + v.farmLive + " rent-farm" : "") + "</small></td><td>" + v.oursLive + " live · " + v.oursSold + " sold</td></tr>";
        }).join("");
        var brows = (g.bands || []).map(function (b) { return "<tr><td>" + esc(b.band) + "</td><td>" + b.n + "</td><td>" + money(b.median) + "<small>" + money(b.p25) + "–" + money(b.p75) + "</small></td><td>" + b.units + "</td><td>" + hrs(b.medianTtsHours) + "</td></tr>"; }).join("");
        var srows = j.sellers.map(function (s) { return "<tr><td><b>" + esc(s.seller) + "</b></td><td>" + esc(s.market) + "</td><td>" + s.units + "</td><td>" + (s.medianPrice != null ? money(s.medianPrice) : "—") + "</td><td>" + s.live + "</td></tr>"; }).join("");
        var live = j.live.slice(0, 60).map(function (l) {
          return '<div class="row"><div class="r1"><span class="t">' + esc(l.title) + '</span><span class="amt">' + money(l.priceUsd) + "</span></div>" +
            '<div class="r2"><span class="pill s-info">' + esc(l.market) + "</span>" + (l.ours ? '<span class="pill s-ok">ours</span>' : "") + (l.kind === "farm" ? '<span class="pill s-unknown">rent-farm</span>' : "") + "<span>" + (l.itemCount ? l.itemCount + " items" : "size not stated") + "</span><span>" + esc(l.seller) + "</span>" + (l.counter != null ? "<span>" + l.counter + " sold (lifetime)</span>" : "") + "<span>seen " + esc(ago(l.lastSeenAt)) + "</span>" + mkLink(l.url) + "</div></div>";
        }).join("");
        var sales = j.sales.map(function (x) {
          return '<div class="row"><div class="r1"><span class="t">' + esc(x.title) + '</span><span class="amt">' + money(x.priceUsd) + (x.units > 1 ? " × " + x.units : "") + "</span></div><div class=\"r2\"><span class=\"pill s-info\">" + esc(x.market) + "</span>" + (x.ours ? '<span class="pill s-ok">ours</span>' : "") + "<span>" + esc(day(x.soldAt)) + "</span>" + (x.ttsHours != null ? "<span>sold after " + hrs(x.ttsHours) + "</span>" : "") + "<span>" + esc(x.seller) + "</span></div></div>";
        }).join("");
        var moves = j.moves.map(moveRow).join("");
        openSheet(g.game, flags + kv +
          '<h4 class="sec">By market</h4><div class="scroll"><table class="pm"><tr><th>market</th><th>units</th><th>paid (n, p25–p75)</th><th>time to sell</th><th>live rivals</th><th>ours</th></tr>' + (mrows || '<tr><td colspan="6">No data.</td></tr>') + "</table></div>" +
          (brows ? '<h4 class="sec">By size</h4><div class="scroll"><table class="pm"><tr><th>items</th><th>sales</th><th>paid</th><th>units</th><th>time to sell</th></tr>' + brows + "</table></div>" : "") +
          (srows ? '<h4 class="sec">Rivals in this game</h4><div class="scroll"><table class="pm"><tr><th>seller</th><th>market</th><th>units</th><th>median</th><th>live</th></tr>' + srows + "</table></div>" : "") +
          (j.undercuts.length ? '<h4 class="sec">Our listings with a cheaper rival</h4><div class="rows">' + j.undercuts.map(undercutRow).join("") + "</div>" : "") +
          '<h4 class="sec">Live listings (cheapest first)</h4><div class="rows">' + (live || '<div class="empty">None seen recently.</div>') + "</div>" +
          '<h4 class="sec">Recent sales</h4><div class="rows">' + (sales || '<div class="empty">None in the window.</div>') + "</div>" +
          (moves ? '<h4 class="sec">Price moves this week</h4><div class="rows">' + moves + "</div>" : ""));
      } catch (e) { openSheet("Error", '<div class="empty">' + esc(e.message) + "</div>"); }
    }

    async function render(force) {
      try {
        if (state.tab === "games") await renderGames();
        else if (state.tab === "market") await renderMarket();
        else if (state.tab === "overview") await renderOverview(force);
        else if (state.tab === "curve") await renderCurve();
        else if (state.tab === "sets") await renderSets();
        else if (state.tab === "advice") await renderAdvice();
        else if (state.tab === "sales") await renderSales();
        else await renderSuggest();
      } catch (e) { fail(e); }
    }
    window.addEventListener("hashchange", function () { var h = (location.hash || "#games").slice(1); if (h !== state.tab && TABS.some(function (t) { return t[0] === h; })) { state.tab = h; render(); } });
    render();
  })();
  </script>
</body>
</html>
