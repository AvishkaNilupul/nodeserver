<!DOCTYPE html>
<html lang="en">

<head>
  <script>(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#f6f7fb;--surface:#ffffff;--surface-2:#f8fafc;--line:#e7eaf0;--ink:#0f172a;--muted:#6b7280;--accent:#4f46e5;--accent-d:#4338ca;--user:#eef2ff;}
    html[data-theme="dark"]{--bg:#0e1014;--surface:#161a22;--surface-2:#1e232e;--line:#2a3140;--ink:#e8ebf2;--muted:#9aa3b4;--user:#232a3a;color-scheme:dark;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:"Inter","Segoe UI",Tahoma,sans-serif;color:var(--ink);background:var(--bg);height:100dvh;display:flex;flex-direction:column;}
    header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:30;flex-wrap:wrap;}
    header .title{font-weight:700;font-size:15px;}
    header .model{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:999px;}
    header .spacer{flex:1;}
    .btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;transition:background .15s;text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
    .btn:hover{background:var(--surface-2);}
    .btn.icon{width:38px;height:38px;justify-content:center;padding:0;font-size:17px;}
    .btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
    main{flex:1;overflow-y:auto;padding:20px 0;}
    .wrap{max-width:760px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:16px;}
    .msg{display:flex;gap:12px;align-items:flex-start;}
    .msg .avatar{flex:0 0 30px;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;}
    .msg.user .avatar{background:var(--accent);}
    .msg.assistant .avatar{background:#0ea5e9;}
    .msg .bubble{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.6;overflow-wrap:anywhere;flex:1;}
    .msg.user .bubble{background:var(--user);}
    .bubble p{margin:0 0 8px;}.bubble p:last-child{margin-bottom:0;}
    .bubble pre{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;margin:8px 0;font-size:13px;}
    .bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;}
    .bubble :not(pre)>code{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 5px;}
    .bubble ul,.bubble ol{margin:6px 0 6px 20px;}
    .bubble a{color:var(--accent);}
    .trace{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
    .trace .chip{font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
    .trace .chip.bad{color:#dc2626;border-color:#dc2626;}
    .working{color:var(--muted);font-size:13px;font-style:italic;}
    .err{color:#dc2626;}
    .act{margin-top:10px;}
    .btn.run{background:#16a34a;color:#fff;border-color:#16a34a;cursor:pointer;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;border:1px solid #16a34a;}
    .btn.run:disabled{opacity:.55;cursor:default;}
    .runlog{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#0b0e14;color:#cfe3ff;border-radius:10px;padding:10px 12px;margin-top:8px;white-space:pre-wrap;max-height:240px;overflow-y:auto;}
    .runlog .ok{color:#7ee787;} .runlog .err{color:#ff7b72;}
    .empty{color:var(--muted);text-align:center;margin-top:12vh;font-size:15px;line-height:1.7;}
    .empty b{color:var(--ink);font-size:20px;}
    footer{border-top:1px solid var(--line);background:var(--surface);padding:12px 0 max(12px,env(safe-area-inset-bottom));}
    .composer{max-width:760px;margin:0 auto;padding:0 16px;display:flex;gap:10px;align-items:flex-end;}
    textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:14.5px;line-height:1.5;max-height:180px;outline:none;}
    textarea:focus{border-color:var(--accent);}
    .send{flex:0 0 auto;background:var(--accent);color:#fff;border:none;border-radius:14px;width:46px;height:46px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .send:hover{background:var(--accent-d);}.send:disabled{opacity:.5;cursor:default;}
    .hint{max-width:760px;margin:6px auto 0;padding:0 16px;font-size:11.5px;color:var(--muted);text-align:center;}
    /* chats panel */
    .backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;}
    .panel{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);background:var(--surface);border-right:1px solid var(--line);z-index:50;display:flex;flex-direction:column;box-shadow:0 0 50px rgba(15,23,42,.3);}
    .panel .phead{display:flex;align-items:center;gap:8px;padding:14px;border-bottom:1px solid var(--line);}
    .panel .phead b{font-size:15px;flex:1;}
    .panel .plist{flex:1;overflow-y:auto;padding:8px;}
    .chatrow{display:flex;align-items:center;gap:8px;padding:10px 10px;border-radius:10px;cursor:pointer;}
    .chatrow:hover{background:var(--surface-2);}
    .chatrow.active{background:var(--surface-2);border:1px solid var(--line);}
    .chatrow .ct{flex:1;min-width:0;}
    .chatrow .ct .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .chatrow .ct .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .chatrow .dot{width:7px;height:7px;border-radius:50%;background:#0ea5e9;flex:0 0 7px;}
    .chatrow .del{opacity:.5;font-size:15px;padding:2px 6px;border-radius:6px;}
    .chatrow .del:hover{opacity:1;background:var(--line);}
  </style>
</head>

<body>
  <header>
    <span class="title">AI Chat</span>
    <span class="model" id="model">…</span>
    <button class="btn" id="mode" title="Analyst reads your logs, data &amp; code">💬 Chat</button>
    <span class="spacer"></span>
    <a class="btn icon" href="/ai-proposals.html" title="Coworker proposals (approve &amp; run)">📋</a>
    <button class="btn icon" id="chatsBtn" title="Saved chats">☰</button>
    <button class="btn icon" id="newBtn" title="New chat">＋</button>
    <button class="btn icon" id="theme" title="Theme">◐</button>
    <a class="btn" href="/admin.html">Exit</a>
  </header>

  <main id="main"><div class="wrap" id="messages"></div></main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message…"></textarea>
      <button class="send" id="send" title="Send">↑</button>
    </div>
    <div class="hint">Chats are saved on the server — close the tab and come back; the answer keeps working.</div>
  </footer>

  <div id="chatsWrap" hidden>
    <div class="backdrop" id="backdrop"></div>
    <div class="panel">
      <div class="phead"><b>Chats</b><button class="btn icon" id="newBtn2" title="New chat">＋</button><button class="btn icon" id="closePanel">✕</button></div>
      <div class="plist" id="plist"></div>
    </div>
  </div>

  <script src="/ai-actions.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const messagesEl = $("messages"), inputEl = $("input"), sendBtn = $("send");
    window.__chatActions = {};
    let chatId = null, mode = "analyst", sending = false, pollTimer = null;

    // ---------- markdown (escape then a few constructs) ----------
    function esc(s){return s.replace(/[&<>]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
    function mdInline(s){return s.replace(/`([^`]+)`/g,(_,c)=>`<code>${c}</code>`).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');}
    function renderMarkdown(text){
      const out=[]; const lines=esc(text).split("\n"); let i=0,listType=null;
      const closeList=()=>{if(listType){out.push(`</${listType}>`);listType=null;}};
      while(i<lines.length){const line=lines[i];const fence=line.match(/^```(.*)$/);
        if(fence){closeList();const buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++;}i++;out.push(`<pre><code>${buf.join("\n")}</code></pre>`);continue;}
        const ul=line.match(/^\s*[-*]\s+(.*)$/);const ol=line.match(/^\s*\d+\.\s+(.*)$/);
        if(ul){if(listType!=="ul"){closeList();out.push("<ul>");listType="ul";}out.push(`<li>${mdInline(ul[1])}</li>`);i++;continue;}
        if(ol){if(listType!=="ol"){closeList();out.push("<ol>");listType="ol";}out.push(`<li>${mdInline(ol[1])}</li>`);i++;continue;}
        closeList();if(line.trim()===""){i++;continue;}out.push(`<p>${mdInline(line)}</p>`);i++;}
      closeList();return out.join("");
    }

    // ---------- api ----------
    async function api(method, path, body){
      const r = await fetch(path, { method, headers: body?{"Content-Type":"application/json"}:{}, body: body?JSON.stringify(body):undefined });
      let j = {}; try{ j = await r.json(); }catch(e){}
      if(!r.ok) throw new Error(j.message || (method+" "+path+" failed ("+r.status+")"));
      return j;
    }
    function scrollDown(){ $("main").scrollTop = $("main").scrollHeight; }
    function fmtTime(d){ try{ return new Date(d).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }

    // ---------- render ----------
    function chipsHtml(trace, working){
      const chips = (trace||[]).map(t=>`<span class="chip">🔧 ${esc(t)}</span>`).join("");
      return (chips?`<div class="trace">${chips}</div>`:"") + (working?'<div class="working">Investigating… reading your logs, data &amp; code</div>':"");
    }
    function actionsHtml(m){
      if(!m.actions || !m.actions.length || m.status!=="done" || !window.AIActions) return "";
      return m.actions.map(a=>{
        window.__chatActions[a.proposalId] = a.action;
        return `<div class="act"><button class="btn run" data-runaction="${a.proposalId}">✓ Approve &amp; run: ${esc(AIActions.label(a.action))}</button><div class="runlog" id="alog-${a.proposalId}" hidden></div></div>`;
      }).join("");
    }
    function assistantBody(m){
      if(m.status==="running") return chipsHtml(m.trace, true);
      if(m.status==="error") return chipsHtml(m.trace,false)+`<span class="err">⚠ ${esc(m.error||m.content||"failed")}</span>`;
      return chipsHtml(m.trace,false) + renderMarkdown(m.content||"*(no answer)*") + actionsHtml(m);
    }
    function rowHtml(m){
      const who = m.role==="user"?"user":"assistant";
      return `<div class="msg ${who}"><div class="avatar">${who==="user"?"Y":"AI"}</div><div class="bubble">${m.role==="user"?esc(m.content).replace(/\n/g,"<br>"):assistantBody(m)}</div></div>`;
    }
    function renderChat(chat){
      if(!chat || !chat.messages || !chat.messages.length){
        messagesEl.innerHTML = '<div class="empty"><b>Ask me anything about your site</b><br />Marketplaces, pricing, listings, bots, sales — I read the data & code, remember, and propose fixes.</div>';
        return;
      }
      messagesEl.innerHTML = chat.messages.map(rowHtml).join("");
      scrollDown();
    }
    function updateLastBubble(m){
      const bubbles = messagesEl.querySelectorAll(".msg.assistant .bubble");
      const el = bubbles[bubbles.length-1];
      if(el){ el.innerHTML = assistantBody(m); scrollDown(); }
    }

    // ---------- polling ----------
    function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
    function startPoll(){
      stopPoll();
      pollTimer = setInterval(async () => {
        if(!chatId) return stopPoll();
        try{
          const { chat } = await api("GET", `/ai-chat/chats/${chatId}`);
          const last = chat.messages[chat.messages.length-1];
          if(last && last.role==="assistant" && last.status==="running"){ updateLastBubble(last); }
          else { renderChat(chat); stopPoll(); loadChats(); }
        }catch(e){ /* transient — keep polling */ }
      }, 1800);
    }

    // ---------- actions ----------
    async function openChat(id){
      stopPoll();
      chatId = id;
      try{ localStorage.setItem("aiCurrentChat", id); }catch(e){}
      const { chat } = await api("GET", `/ai-chat/chats/${id}`);
      renderChat(chat);
      const last = chat && chat.messages[chat.messages.length-1];
      if(last && last.role==="assistant" && last.status==="running") startPoll();
      highlightActive();
    }
    async function newChat(){
      const { id } = await api("POST", "/ai-chat/chats");
      closePanel();
      await openChat(id);
      inputEl.focus();
      loadChats();
    }
    async function ensureChat(){ if(!chatId){ const { id } = await api("POST","/ai-chat/chats"); chatId=id; try{localStorage.setItem("aiCurrentChat",id);}catch(e){} } return chatId; }

    async function send(){
      const text = inputEl.value.trim();
      if(!text || sending) return;
      inputEl.value=""; inputEl.style.height="auto";
      sending=true; sendBtn.disabled=true;
      try{
        await ensureChat();
        // optimistic user bubble
        messagesEl.insertAdjacentHTML("beforeend", rowHtml({role:"user",content:text}));
        messagesEl.insertAdjacentHTML("beforeend", rowHtml({role:"assistant",status:"running",trace:[]}));
        scrollDown();
        await api("POST", `/ai-chat/chats/${chatId}/ask`, { content:text, mode });
        startPoll();
      }catch(e){
        messagesEl.insertAdjacentHTML("beforeend", `<div class="msg assistant"><div class="avatar">AI</div><div class="bubble"><span class="err">⚠ ${esc(e.message)}</span></div></div>`);
      }finally{ sending=false; sendBtn.disabled=false; inputEl.focus(); }
    }

    // ---------- chats panel ----------
    async function loadChats(){
      try{
        const { chats } = await api("GET","/ai-chat/chats");
        $("plist").innerHTML = chats.length ? chats.map(c=>`
          <div class="chatrow ${c.id===chatId?'active':''}" data-id="${c.id}">
            ${c.running?'<span class="dot" title="working"></span>':''}
            <div class="ct"><div class="t">${esc(c.title||"New chat")}</div><div class="s">${fmtTime(c.updatedAt)} · ${c.count} msg${c.snippet?" · "+esc(c.snippet):""}</div></div>
            <span class="del" data-del="${c.id}" title="Delete">🗑</span>
          </div>`).join("") : '<div class="empty" style="margin-top:20px;font-size:13px">No chats yet</div>';
      }catch(e){ $("plist").innerHTML = `<div class="err" style="padding:12px">${esc(e.message)}</div>`; }
    }
    function highlightActive(){ document.querySelectorAll(".chatrow").forEach(r=>r.classList.toggle("active", r.dataset.id===chatId)); }
    function openPanel(){ loadChats(); $("chatsWrap").hidden=false; }
    function closePanel(){ $("chatsWrap").hidden=true; }

    // ---------- mode + theme ----------
    function applyMode(){
      const b=$("mode");
      b.textContent = mode==="analyst" ? "🔎 Analyst" : "💬 Chat";
      b.classList.toggle("on", mode==="analyst");
      inputEl.placeholder = mode==="analyst" ? 'Ask about your site… e.g. "anything failing today?"' : "Message…";
    }

    // ---------- inline "Approve & run" ----------
    messagesEl.addEventListener("click", async (e)=>{
      const b = e.target.closest("[data-runaction]");
      if(!b) return;
      const pid = b.dataset.runaction;
      const action = window.__chatActions[pid];
      if(!action) return;
      if(!confirm("Approve & run this now? It changes the live fleet.")) return;
      b.disabled = true; b.textContent = "Running…";
      const el = $("alog-"+pid);
      const log = (m,c)=>{ if(el){ el.hidden=false; el.innerHTML += `<div class="${c||''}">${esc(m)}</div>`; el.scrollTop=el.scrollHeight; scrollDown(); } };
      try{
        await window.AIActions.run(action, log);
        await api("POST", `/ai-chat/proposals/${pid}/status`, { status:"applied" });
        log("Marked applied.", "ok"); b.textContent = "✓ Done";
      }catch(err){
        log("⚠ "+err.message, "err"); log("Left open — retry here or in 📋 Proposals.", "err");
        b.disabled=false; b.textContent="✓ Approve & run";
      }
    });

    // ---------- events ----------
    sendBtn.addEventListener("click", send);
    inputEl.addEventListener("keydown", (e)=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
    inputEl.addEventListener("input", ()=>{ inputEl.style.height="auto"; inputEl.style.height=Math.min(inputEl.scrollHeight,180)+"px"; });
    $("mode").addEventListener("click", ()=>{ mode = mode==="analyst"?"chat":"analyst"; try{localStorage.setItem("aiChatMode",mode);}catch(e){} applyMode(); inputEl.focus(); });
    $("newBtn").addEventListener("click", newChat);
    $("newBtn2").addEventListener("click", newChat);
    $("chatsBtn").addEventListener("click", openPanel);
    $("closePanel").addEventListener("click", closePanel);
    $("backdrop").addEventListener("click", closePanel);
    $("plist").addEventListener("click", async (e)=>{
      const del = e.target.closest("[data-del]");
      if(del){ e.stopPropagation(); if(confirm("Delete this chat?")){ await api("DELETE",`/ai-chat/chats/${del.dataset.del}`); if(del.dataset.del===chatId){ chatId=null; try{localStorage.removeItem("aiCurrentChat");}catch(x){} await bootChat(); } loadChats(); } return; }
      const row = e.target.closest(".chatrow");
      if(row){ closePanel(); openChat(row.dataset.id); }
    });
    $("theme").addEventListener("click", ()=>{ const dark=document.documentElement.getAttribute("data-theme")==="dark"; if(dark){document.documentElement.removeAttribute("data-theme");localStorage.setItem("theme","light");}else{document.documentElement.setAttribute("data-theme","dark");localStorage.setItem("theme","dark");} });

    // ---------- init ----------
    async function bootChat(){
      let saved=null; try{ saved=localStorage.getItem("aiCurrentChat"); }catch(e){}
      if(saved){ try{ await openChat(saved); return; }catch(e){ /* deleted — fall through */ } }
      // else open most recent, or create
      try{
        const { chats } = await api("GET","/ai-chat/chats");
        if(chats.length) await openChat(chats[0].id);
        else await newChat();
      }catch(e){ await newChat().catch(()=>{}); }
    }
    fetch("/ai-chat/config").then(r=>r.json()).then(c=>{ $("model").textContent=c.model||"AI"; }).catch(()=>{ $("model").textContent="AI"; });
    try{ mode = localStorage.getItem("aiChatMode")==="chat" ? "chat" : "analyst"; }catch(e){}
    applyMode(); bootChat(); inputEl.focus();
  </script>
</body>

</html>
