<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlayerAuctions — Console</title>
<style>
  :root {
    --bg: #0f1621; --panel: #16202e; --line: #24324a; --text: #e6edf6;
    --dim: #93a4bd; --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #f0a92b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
  h1 { font-size: 22px; margin: 6px 0 4px; }
  .sub { color: var(--dim); margin-bottom: 18px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 14px 16px; margin-bottom: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  .row > .panel { flex: 1 1 220px; margin-bottom: 0; }
  .k { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px;
          font-weight: 600; }
  .pill.ok { background: rgba(63,185,80,.15); color: var(--ok); }
  .pill.bad { background: rgba(248,81,73,.15); color: var(--bad); }
  .pill.warn { background: rgba(210,153,34,.15); color: var(--warn); }
  button { background: #23334c; color: var(--text); border: 1px solid var(--line);
           border-radius: 7px; padding: 7px 13px; cursor: pointer; font-size: 13px; }
  button:hover { background: #2c3f5d; }
  button.primary { background: var(--accent); color: #241a05; border-color: var(--accent);
                   font-weight: 600; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 12px; }
  .tabs button.active { background: var(--accent); color: #241a05; border-color: var(--accent);
                        font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
           vertical-align: top; }
  th { color: var(--dim); font-weight: 600; font-size: 12px; text-transform: uppercase;
       letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  .scroll { overflow-x: auto; }
  .muted { color: var(--dim); }
  .dead { border-color: var(--bad); }
  .dead h2 { color: var(--bad); margin: 0 0 6px; font-size: 16px; }
  code { background: #0b1220; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  .empty { color: var(--dim); padding: 18px 4px; }
</style>
</head>
<body>
<div id="adminNav"></div>
<div class="wrap">
  <h1>PlayerAuctions</h1>
  <div class="sub">
    Read-only. Everything here comes through the server's session — so you never
    have to open PlayerAuctions in a browser, which is the one thing that kills it.
  </div>

  <div id="sessionBox"></div>
  <div class="row" id="stats"></div>

  <div class="tabs" id="tabs"></div>
  <div class="panel" id="view"><div class="empty">Loading…</div></div>
</div>

<script src="/admin-nav.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = { tab: "pending", snapshot: null };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function get(path) {
    return fetch(path, { credentials: "same-origin" }).then(function (r) { return r.json(); });
  }

  function post(path, body) {
    return fetch(path, {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    }).then(function (r) { return r.json(); });
  }

  // PlayerAuctions allows one session per account, so a dead session is an
  // expected state with a known one-step fix — say exactly that, not "error".
  function renderSessionDead(msg, howToFix) {
    $("sessionBox").innerHTML =
      '<div class="panel dead"><h2>Session is dead — auto-delivery has stopped</h2>' +
      '<div class="muted" style="margin-bottom:8px">' + esc(msg || "") + "</div>" +
      "<div>" + esc(howToFix || "") + "</div></div>";
  }

  function renderSession(d) {
    if (!d.configured) {
      renderSessionDead(
        "No PlayerAuctions cookie is stored.",
        "Paste the Cookie header into the PlayerAuctions credential in the listings keys modal."
      );
      return;
    }
    var access = d.accessMinsLeft;
    var cls = access == null ? "warn" : access > 0 ? "ok" : "warn";
    var txt = access == null ? "unknown"
      : access > 0 ? access + " min left"
      : "expired " + Math.abs(access) + " min ago (the server renews it on the next call)";
    $("sessionBox").innerHTML =
      '<div class="panel"><span class="k">Session</span> ' +
      '<span class="pill ' + cls + '">' + esc(txt) + "</span> " +
      '<span class="muted" style="margin-left:10px">refresh token ' +
      esc(d.refreshMinsLeft == null ? "?" : Math.round(d.refreshMinsLeft / 60) + "h") +
      " left</span>" +
      '<button style="float:right" onclick="window.__paCheck()">Check now</button></div>';
  }

  function stat(k, v, cls) {
    return '<div class="panel"><div class="k">' + esc(k) + "</div>" +
      '<div class="v ' + (cls || "") + '">' + esc(v) + "</div></div>";
  }

  function renderStats(s) {
    var pend = (s.pending || []).length;
    $("stats").innerHTML =
      stat("Seller", s.seller.nickName + " (L" + s.seller.level + ")") +
      stat("Active offers", s.offers.count) +
      stat("Lifetime orders", s.orders.count) +
      stat("Awaiting delivery", pend);
  }

  var TABS = [
    ["pending", "Awaiting delivery"],
    ["orders", "Orders"],
    ["offers", "Offers"],
    ["messages", "Messages"],
    ["balance", "Balance"]
  ];

  function renderTabs() {
    $("tabs").innerHTML = TABS.map(function (t) {
      return '<button class="' + (state.tab === t[0] ? "active" : "") +
        '" onclick="window.__paTab(\'' + t[0] + '\')">' + esc(t[1]) + "</button>";
    }).join("");
  }

  function table(cols, rows) {
    if (!rows.length) return '<div class="empty">Nothing here.</div>';
    return '<div class="scroll"><table><thead><tr>' +
      cols.map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("") +
      "</tr></thead><tbody>" +
      rows.map(function (r) {
        return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>";
      }).join("") + "</tbody></table></div>";
  }

  function show(html) { $("view").innerHTML = html; }

  function loadTab() {
    renderTabs();
    show('<div class="empty">Loading…</div>');
    var s = state.snapshot;

    if (state.tab === "pending") {
      var p = (s && s.pending) || [];
      show(
        '<div class="muted" style="margin-bottom:10px">Orders the delivery bot will ship on its next tick (it runs every 60 seconds).</div>' +
        table(["Order", "Title", "Buyer", "Price", "Qty", "Placed"],
          p.map(function (o) {
            return ['<code>' + esc(o.orderId) + "</code>", esc(o.title), esc(o.buyer),
              esc(o.price), esc(o.quantity), esc(o.createTime)];
          }))
      );
      return;
    }

    if (state.tab === "orders") {
      var o = (s && s.orders) || { items: [], byStatus: {} };
      var chips = Object.keys(o.byStatus || {}).map(function (k) {
        return '<span class="pill warn" style="margin-right:6px">' +
          esc(o.byStatus[k] + " " + k) + "</span>";
      }).join("");
      show('<div style="margin-bottom:10px">' + chips + "</div>" +
        table(["Order", "Title", "Buyer", "Price", "Status", "Placed"],
          (o.items || []).map(function (r) {
            return ['<code>' + esc(r.orderId) + "</code>", esc(r.orderTitle), esc(r.name),
              esc(r.price), esc(r.status), esc(r.createTime)];
          })));
      return;
    }

    if (state.tab === "offers") {
      var f = (s && s.offers) || { items: [] };
      show(table(["Offer", "Title", "Game", "Price", "Delivery", "Expires"],
        (f.items || []).map(function (r) {
          return ['<code>' + esc(r.offerId) + "</code>", esc(r.title), esc(r.gameName),
            esc(r.totalPrice), esc(r.deliveryGuarantee), esc(r.expiredTimeString)];
        })));
      return;
    }

    if (state.tab === "messages") {
      get("/playerauctions/messages").then(function (r) {
        if (!r.success) return show('<div class="empty">' + esc(r.message) + "</div>");
        var items = (r.data && (r.data.items || r.data.list || r.data)) || [];
        if (!Array.isArray(items)) items = [];
        if (!items.length) return show('<div class="empty">Nothing here.</div>');
        var rows = items.map(function (m) {
          var who = esc(m.memberName || m.senderName || m.from || "—");
          if (m.isFromSystem) who += ' <span class="muted">(system)</span>';
          var subj = esc(m.subject || m.title || m.content || "—");
          if (m.unRead) subj = "<strong>" + subj + "</strong>";
          var when = esc(m.sendTimeString || m.createTime || m.date || "");
          return '<tr style="cursor:pointer" onclick="window.__paThread(' + Number(m.id) +
            ',' + (m.isFromSystem ? "true" : "false") + ')"><td>' + who +
            "</td><td>" + subj + "</td><td>" + when + "</td></tr>";
        }).join("");
        show('<div class="muted" style="margin-bottom:10px">Click a row to read the conversation.</div>' +
          '<div class="scroll"><table><thead><tr><th>From</th><th>Subject</th><th>When</th>' +
          "</tr></thead><tbody>" + rows + "</tbody></table></div>");
      });
      return;
    }

    if (state.tab === "balance") {
      get("/playerauctions/balance").then(function (r) {
        if (!r.success) return show('<div class="empty">' + esc(r.message) + "</div>");
        show('<pre style="white-space:pre-wrap;font-size:12px">' +
          esc(JSON.stringify(r.data, null, 2)) + "</pre>");
      });
    }
  }

  window.__paTab = function (t) { state.tab = t; loadTab(); };

  window.__paThread = function (id, isSystem) {
    show('<div class="empty">Loading conversation…</div>');
    get("/playerauctions/messages/" + encodeURIComponent(id) + "?system=" + (isSystem ? "true" : "false"))
      .then(function (r) {
        if (!r.success) return show('<div class="empty">' + esc(r.message) + "</div>");
        var d = r.data || {};
        var head =
          '<button onclick="window.__paTab(\'messages\')">← Back to messages</button>' +
          '<div style="margin:12px 0 2px"><strong>' + esc(d.subject || "Conversation") + "</strong></div>" +
          '<div class="muted" style="margin-bottom:12px">' +
          (d.orderId ? "Order " + esc(d.orderId) + " · " : "") +
          (d.buyerName ? "Buyer " + esc(d.buyerName) + " · " : "") +
          esc(d.orderStatus || "") + "</div>";
        var msgs = (d.comments || []).map(function (c) {
          var side = c.mine ? "flex-end" : "flex-start";
          var bg = c.mine ? "#173a2a" : "#182335";
          return '<div style="display:flex;justify-content:' + side + ';margin:8px 0">' +
            '<div style="max-width:80%;background:' + bg + ';border:1px solid var(--line);' +
            'border-radius:10px;padding:8px 12px">' +
            '<div class="muted" style="font-size:12px;margin-bottom:4px">' +
            esc(c.who) + " · " + esc(c.at) + "</div>" +
            '<div style="white-space:pre-wrap;word-break:break-word">' + esc(c.text) + "</div></div></div>";
        }).join("");
        state.thread = { id: id, isSystem: isSystem, orderId: d.orderId };
        var composer = "";
        if (d.orderId && !isSystem) {
          composer =
            '<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">' +
            '<textarea id="paReplyText" maxlength="300" rows="3" placeholder="Reply to ' +
            esc(d.buyerName || "buyer") + '…" style="width:100%;background:#0b1220;color:var(--text);' +
            'border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;resize:vertical"></textarea>' +
            '<div style="display:flex;align-items:center;gap:12px;margin-top:8px">' +
            '<button class="primary" id="paSendBtn" onclick="window.__paSend()">Send reply</button>' +
            '<span class="muted">Max 300 characters · goes to the buyer on PlayerAuctions</span>' +
            '<span id="paReplyMsg" class="muted" style="margin-left:auto"></span></div></div>';
        }
        show(head + (msgs || '<div class="empty">No messages in this thread.</div>') + composer);
      });
  };

  window.__paSend = function () {
    var t = state.thread || {};
    var el = document.getElementById("paReplyText");
    var msg = document.getElementById("paReplyMsg");
    var btn = document.getElementById("paSendBtn");
    if (!el || !t.orderId) return;
    var text = (el.value || "").trim();
    if (!text) { if (msg) msg.textContent = "Type a message first."; return; }
    if (text.length > 300) { if (msg) msg.textContent = "Over the 300-character limit."; return; }
    if (btn) btn.disabled = true;
    if (msg) msg.textContent = "Sending…";
    post("/playerauctions/messages/reply", { orderId: t.orderId, content: text })
      .then(function (r) {
        if (r && r.success) {
          window.__paThread(t.id, t.isSystem);
        } else {
          if (btn) btn.disabled = false;
          if (msg) msg.textContent = "Failed: " + ((r && r.message) || "unknown error");
        }
      })
      .catch(function (e) {
        if (btn) btn.disabled = false;
        if (msg) msg.textContent = "Failed: " + (e.message || "network error");
      });
  };

  window.__paCheck = function () {
    get("/playerauctions/health").then(function () { boot(); });
  };

  function boot() {
    get("/playerauctions/session").then(function (r) {
      if (r.success) renderSession(r.data);
    });
    get("/playerauctions/snapshot").then(function (r) {
      if (!r.success) {
        renderSessionDead(r.message, r.howToFix);
        $("stats").innerHTML = "";
        show('<div class="empty">Nothing can be read until the session is restored.</div>');
        renderTabs();
        return;
      }
      state.snapshot = r.data;
      renderStats(r.data);
      loadTab();
    });
  }

  boot();
  setInterval(boot, 60000);
})();
</script>
</body>
</html>
