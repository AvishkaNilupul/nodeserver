<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark")
            document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CHZZK farm</title>
    <!-- CHZZK farm v2 (docs/CHZZK-PANEL-V2.md). Tokens, sidebar shell and the
         whole component kit live in chzzk.css; the kit is window.Chzzk from
         core.js (public/soop/UI-KIT.md with Soop → Chzzk). -->
    <link rel="stylesheet" href="/chzzk/chzzk.css" />
    <!-- The Listings tab (docs/code-shop/08-LISTINGS-BOARD.md), shared with /soop.html. -->
    <link rel="stylesheet" href="/shop-board/board.css" />
    <!-- Phone menu's closed drawer; keep this last in <head>. -->
    <link rel="stylesheet" href="/admin-nav.css" />
  </head>
  <body>
    <aside class="nav">
      <div class="brand">
        <span class="mark">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon points="12 2 2 8.5 12 15 22 8.5 12 2"></polygon>
            <path d="M2 8.5v7L12 22l10-6.5v-7"></path>
          </svg>
        </span>
        <b>RedeemHub<span>Admin console</span></b>
      </div>
      <nav class="links">
        <a href="/admin.html"
          ><svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path
              d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
            ></path>
          </svg>
          Inbox</a
        >
        <a href="/orders"
          ><svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <path d="M3 9h18M7 14h6"></path>
          </svg>
          Orders</a
        >
        <a href="/inventory"
          ><svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M20 7H4M16 3H8M6 11h12l-1 10H7z"></path>
          </svg>
          Inventory</a
        >
      </nav>
      <div class="me">
        <span class="av" id="meAvatar">--</span>
        <div class="who">
          <b id="meName">Admin</b><span id="meRole">Seller</span>
        </div>
        <button
          class="logout"
          data-theme-toggle
          onclick="toggleTheme()"
          title="Toggle dark mode"
        >
          <svg
            class="t-moon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg
            class="t-sun"
            style="display: none"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
            ></path>
          </svg>
        </button>
      </div>
    </aside>

    <main class="s-main" id="chzzkMain">
      <header class="s-head">
        <div class="s-grow">
          <h1>CHZZK farm</h1>
          <p class="s-status" id="chzzkStatus">
            <span class="s-dot is-muted" aria-hidden="true"></span>
            <span>Connecting…</span>
          </p>
        </div>
        <div class="s-head-actions">
          <button
            type="button"
            class="s-btn is-icon"
            id="chzzkMenuBtn"
            aria-label="Farm actions"
            title="Farm actions"
          >
            <svg class="s-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 12a1 1 0 1 0 2 0 1 1 0 1 0-2 0M11 12a1 1 0 1 0 2 0 1 1 0 1 0-2 0M18 12a1 1 0 1 0 2 0 1 1 0 1 0-2 0"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Filled and shown by core.js after 3 failed /state polls. -->
      <div class="s-banner" id="chzzkBanner" role="alert" hidden></div>

      <!-- One button + one root per tab. A tab-*.js file claims its root with
           Chzzk.registerTab({ id }); until then the root keeps its placeholder,
           so a missing or broken tab file never takes the page down. -->
      <div class="s-tabs" id="chzzkTabs" role="tablist" aria-label="CHZZK farm sections">
        <button type="button" class="s-tab is-active" role="tab" id="tab-overview" data-tab="overview" aria-controls="panel-overview" aria-selected="true">
          <span class="s-tab-label">Overview</span><span class="s-tab-badge" hidden></span>
        </button>
        <button type="button" class="s-tab" role="tab" id="tab-accounts" data-tab="accounts" aria-controls="panel-accounts" aria-selected="false" tabindex="-1">
          <span class="s-tab-label">Accounts</span><span class="s-tab-badge" hidden></span>
        </button>
        <button type="button" class="s-tab" role="tab" id="tab-campaigns" data-tab="campaigns" aria-controls="panel-campaigns" aria-selected="false" tabindex="-1">
          <span class="s-tab-label">Campaigns</span><span class="s-tab-badge" hidden></span>
        </button>
        <button type="button" class="s-tab" role="tab" id="tab-codes" data-tab="codes" aria-controls="panel-codes" aria-selected="false" tabindex="-1">
          <span class="s-tab-label">Codes</span><span class="s-tab-badge" hidden></span>
        </button>
        <button type="button" class="s-tab" role="tab" id="tab-listings" data-tab="listings" aria-controls="panel-listings" aria-selected="false" tabindex="-1">
          <span class="s-tab-label">Listings</span><span class="s-tab-badge" hidden></span>
        </button>
        <button type="button" class="s-tab" role="tab" id="tab-activity" data-tab="activity" aria-controls="panel-activity" aria-selected="false" tabindex="-1">
          <span class="s-tab-label">Activity</span><span class="s-tab-badge" hidden></span>
        </button>
      </div>

      <section class="s-panel" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview" data-tab-root="overview">
        <p class="s-loading">Loading…</p>
      </section>
      <section class="s-panel" id="panel-accounts" role="tabpanel" aria-labelledby="tab-accounts" data-tab-root="accounts" hidden>
        <p class="s-loading">Loading…</p>
      </section>
      <section class="s-panel" id="panel-campaigns" role="tabpanel" aria-labelledby="tab-campaigns" data-tab-root="campaigns" hidden>
        <p class="s-loading">Loading…</p>
      </section>
      <section class="s-panel" id="panel-codes" role="tabpanel" aria-labelledby="tab-codes" data-tab-root="codes" hidden>
        <p class="s-loading">Loading…</p>
      </section>
      <section class="s-panel" id="panel-listings" role="tabpanel" aria-labelledby="tab-listings" data-tab-root="listings" hidden>
        <p class="s-loading">Loading…</p>
      </section>
      <section class="s-panel" id="panel-activity" role="tabpanel" aria-labelledby="tab-activity" data-tab-root="activity" hidden>
        <p class="s-loading">Loading…</p>
      </section>
    </main>

    <script src="/theme.js"></script>
    <script src="/admin-nav.js"></script>
    <script src="/chzzk/core.js"></script>
    <script src="/chzzk/tab-overview.js"></script>
    <script src="/chzzk/tab-accounts.js"></script>
    <script src="/chzzk/tab-campaigns.js"></script>
    <script src="/chzzk/tab-codes.js"></script>
    <!-- The Listings tab: board.js first, it defines window.ShopBoard. -->
    <script src="/shop-board/board.js"></script>
    <script src="/chzzk/tab-listings.js"></script>
    <script src="/chzzk/tab-activity.js"></script>
    <!-- Defines window.ChzzkImport and owns the page-wide file drop. -->
    <script src="/chzzk/accounts-import.js"></script>
  </body>
</html>
