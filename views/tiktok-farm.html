<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Farm</title>
<style>
  :root { color-scheme: dark; font: 15px system-ui; background: #12151c; color: #edf0f7; }
  main { max-width: 1100px; margin: 36px auto; padding: 0 20px; }
  h1 { margin-bottom: 4px; }
  h2 { font-size: 18px; }
  p, small { color: #afb8c8; }
  section { background: #1c222d; border: 1px solid #364052; border-radius: 12px; padding: 20px; margin: 18px 0; overflow: auto; }
  form, #accounts { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; }
  form label { display: grid; gap: 5px; }
  input, button { font: inherit; padding: 7px 10px; border: 1px solid #596983; border-radius: 6px; }
  input { background: #12151c; color: inherit; }
  button { background: #283449; color: inherit; cursor: pointer; }
  button.primary { background: #345acb; border-color: #6684e4; font-weight: 650; }
  button:disabled { opacity: .55; cursor: default; }
  #accounts { margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  td, th { padding: 9px; border-bottom: 1px solid #364052; white-space: nowrap; }
  #status { min-height: 1.4em; }
  .error { color: #ffc0c2; }
  @media (max-width: 600px) { main { margin-top: 12px; } section { padding: 12px; } }
</style>
<script defer src="/admin-nav.js"></script>
</head>
<body>
<main>
  <h1>TikTok Farm</h1>
  <p>Run a drop on multiple accounts and collect the issued codes.</p>
  <p id="status" role="status" aria-live="polite"></p>
  <section>
    <h2>Go Farm</h2>
    <div id="accounts">Checking Mac workers…</div>
    <form id="start">
      <label>Campaign ID<input name="campaign" required pattern="[0-9]{1,22}" inputmode="numeric"></label>
      <label>LIVE room ID<input name="room" required pattern="[0-9]{1,22}" inputmode="numeric"></label>
      <label>Reward task ID<input name="task" required pattern="[0-9]{1,22}|auto" value="auto" title="Use auto when there is exactly one eligible countdown reward"></label>
      <button class="primary" disabled>Go Farm</button>
    </form>
  </section>
  <section>
    <h2>Runs</h2>
    <table><thead><tr><th>Account</th><th>Campaign</th><th>Task</th><th>State</th><th>Progress</th><th></th></tr></thead>
    <tbody id="runs"></tbody></table>
  </section>
  <section>
    <h2>Code inventory</h2>
    <table><thead><tr><th>Account</th><th>Campaign</th><th>Task</th><th>Stored</th><th>Code</th></tr></thead>
    <tbody id="codes"></tbody></table>
  </section>
</main>
<script>
const form = document.querySelector("#start");
const accountsBox = document.querySelector("#accounts");
const statusBox = document.querySelector("#status");
const root = "/api/tiktok-farm";
const disabled = new Set();
let accountSignature;
let runSignature;
let codeSignature;

async function api(path, body) {
  const result = await fetch(root + path, body === undefined ? { headers: { Accept: "application/json" } } : {
    method: "POST", headers: { Accept: "application/json", "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await result.json();
  if (!result.ok) throw new Error(data.error || data.message || "Request failed");
  return data;
}

function report(text, error = false) {
  statusBox.textContent = text;
  statusBox.classList.toggle("error", error);
}

function row(table, values) {
  const item = table.insertRow();
  for (const value of values) item.insertCell().textContent = value;
  return item.insertCell();
}

function empty(table, columns, text) {
  const cell = table.insertRow().insertCell();
  cell.colSpan = columns;
  cell.textContent = text;
}

function renderAccounts(accounts) {
  const slots = accounts.map(({ account }) => account).sort();
  const signature = slots.join(",");
  if (signature === accountSignature) return;
  accountSignature = signature;
  accountsBox.replaceChildren();
  for (const slot of slots) {
    const label = document.createElement("label");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = slot;
    checkbox.checked = !disabled.has(slot);
    checkbox.addEventListener("change", () => {
      if (checkbox.checked) disabled.delete(slot);
      else disabled.add(slot);
    });
    label.append(checkbox, " " + slot);
    accountsBox.append(label);
  }
  if (!slots.length) accountsBox.textContent = "No Mac worker online.";
  form.querySelector("button").disabled = !slots.length;
}

function renderRuns(runs) {
  const signature = JSON.stringify(runs);
  if (signature === runSignature) return;
  runSignature = signature;
  const table = document.querySelector("#runs");
  table.replaceChildren();
  if (!runs.length) empty(table, 6, "No runs yet.");
  for (const run of runs) {
    const state = run.stopRequested && run.active ? "Stopping" : run.state + " · " + run.phase;
    const actions = row(table, [run.account, run.campaign, run.task, state, run.seconds + "s"]);
    if (!run.active || run.stopRequested || run.phase === "claiming") continue;
    const stop = document.createElement("button");
    stop.textContent = "Stop";
    stop.onclick = async () => {
      stop.disabled = true;
      try { await api("/runs/" + run._id + "/stop", {}); await refresh(); }
      catch (error) { report(error.message, true); stop.disabled = false; }
    };
    actions.append(stop);
  }
}

function renderCodes(codes) {
  const signature = JSON.stringify(codes);
  if (signature === codeSignature) return;
  codeSignature = signature;
  const table = document.querySelector("#codes");
  table.replaceChildren();
  if (!codes.length) empty(table, 5, "No codes stored yet.");
  for (const code of codes) {
    const actions = row(table, [code.account, code.campaign, code.task, new Date(code.updatedAt).toLocaleString()]);
    const button = document.createElement("button");
    button.textContent = "Reveal";
    button.onclick = async () => {
      try {
        if (button.textContent === "Hide") { actions.firstChild.remove(); button.textContent = "Reveal"; return; }
        const result = await api("/codes/" + code._id);
        const value = document.createElement("code");
        value.textContent = result.code + " ";
        actions.prepend(value);
        button.textContent = "Hide";
      } catch (error) { report(error.message, true); }
    };
    actions.append(button);
  }
}

let refreshing = false;
async function refresh() {
  if (refreshing) return;
  refreshing = true;
  try {
    const data = await api("/state");
    renderAccounts(data.accounts);
    renderRuns(data.runs);
    renderCodes(data.codes);
  } catch (error) { report(error.message, true); }
  finally { refreshing = false; }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = form.querySelector("button");
  const accounts = [...accountsBox.querySelectorAll("input:checked")].map((input) => input.value);
  if (!accounts.length) return report("Choose at least one account.", true);
  button.disabled = true;
  try {
    const { results } = await api("/start", { ...Object.fromEntries(new FormData(form)), accounts });
    const message = results.map((item) => item.account + (item.queued ? " queued" : " · " + item.reason));
    report(message.join(" · "));
    await refresh();
  } catch (error) { report(error.message, true); }
  finally { button.disabled = !accountsBox.querySelector("input"); }
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
