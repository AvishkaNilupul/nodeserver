<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px/1.45 -apple-system, system-ui, sans-serif;
        /* Desktop popup: a compact fixed column. iOS/Orion render the popup as a
           full page, so on a wide viewport we fill it (centered, capped) instead
           of leaving the content stranded in a tiny corner. */
        width: 340px;
        max-width: 100%;
        margin: 0 auto;
        box-sizing: border-box;
        padding: 16px;
        color: #e8e8ea;
        background: #12161f;
      }
      @media (min-width: 380px) {
        body {
          width: min(92vw, 560px);
          font-size: 15px;
          padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
        }
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
        color: #fff;
      }
      p.lede {
        margin: 0 0 10px;
        color: #7f8a9c;
        font-size: 12px;
      }
      label {
        display: block;
        margin: 8px 0 3px;
        color: #a8b0bd;
        font-size: 12px;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 10px;
        border: 1px solid #2b3446;
        border-radius: 8px;
        background: #1b2130;
        color: #e8e8ea;
        /* 16px keeps iOS Safari/Orion from zooming the page on focus. */
        font-family: inherit;
        font-size: 16px;
        line-height: 1.3;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 9px 0 0;
        color: #c4ccd8;
        font-size: 12px;
      }
      .check input {
        margin: 0;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        flex: 1;
        min-height: 44px;
        padding: 11px 12px;
        border: 0;
        border-radius: 9px;
        background: #263044;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button.primary {
        background-image: linear-gradient(90deg, #ff9900, #ff4d00);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .save {
        margin-top: 10px;
        background: transparent;
        border: 1px solid #2b3446;
        color: #a8b0bd;
        font-weight: 500;
      }
      #status,
      #last {
        margin-top: 12px;
        padding: 9px 10px;
        border-radius: 8px;
        font-size: 12px;
        white-space: pre-wrap;
        display: none;
      }
      #status.ok,
      #last.ok {
        display: block;
        background: #16351f;
        color: #baf5c8;
      }
      #status.err,
      #last.err {
        display: block;
        background: #3a1a1a;
        color: #f6bcbc;
      }
      #status.info,
      #last.info {
        display: block;
        background: #1b2130;
        color: #a8b0bd;
      }
      details {
        margin-top: 12px;
      }
      summary {
        color: #7f8a9c;
        cursor: pointer;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>PlayerAuctions → redeemer</h1>
    <p class="lede">
      Auto-push is on: just sign in at member.playerauctions.com and the new
      session installs itself. The buttons below are a manual fallback.
    </p>

    <div id="last"></div>

    <div class="row">
      <button id="check">Check this device</button>
      <button id="push" class="primary" disabled>Grab &amp; push now</button>
    </div>

    <div id="status"></div>

    <details>
      <summary>Settings &amp; fallback</summary>
      <label for="url">Server base URL</label>
      <input id="url" type="text" placeholder="https://your-redeemer-host" />
      <label for="secret">Install secret</label>
      <input id="secret" type="password" placeholder="(from the server)" />
      <button id="save" class="save">Save settings</button>

      <label class="check">
        <input id="autoPush" type="checkbox" />
        Auto-push the moment I sign in
      </label>
      <label class="check">
        <input id="closeTabs" type="checkbox" />
        Close PlayerAuctions tabs after pushing (keeps the server the only session)
      </label>

      <div class="row">
        <button id="copy">Copy cookie header</button>
      </div>
    </details>

    <script src="logic.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
