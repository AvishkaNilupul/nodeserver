<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820"><title>Epic Claims</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#eff5f7;font:18px system-ui,sans-serif}main{max-width:650px;margin:auto;padding:32px 24px 64px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:29px;margin:12px 0 28px}small,.muted{color:#a7bac4}#count{font-size:76px;font-weight:750;letter-spacing:-4px;line-height:1.1}.card{background:#192731;border:1px solid #31444f;border-radius:20px;padding:26px;margin:18px 0}.caption{margin-top:7px;color:#b9cbd2}#games{list-style:none;padding:0;margin:24px 0 0}#games li{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #31444f;padding:14px 0}button{width:100%;border:0;border-radius:13px;padding:17px;margin:8px 0;font:inherit;font-weight:700;background:#a8f0c5;color:#10291b;cursor:pointer}button:disabled{opacity:.45;cursor:default}.secondary{background:#253b48;color:#eff5f7}#message{line-height:1.6;min-height:56px}progress{width:100%;height:10px;accent-color:#a8f0c5}#stop{display:none}a{color:#a8f0c5}#connection{font-size:13px}#error{color:#ffb9a5;line-height:1.5}footer{font-size:14px;line-height:1.7;color:#a7bac4;margin-top:22px}
</style></head><body><main><header><h1>Epic Claims</h1><span id="connection">Connecting</span></header>
<section class="card"><div id="count">—</div><div class="caption" id="caption">Checking remaining claims</div><ul id="games"></ul></section>
<section class="card"><div id="message" role="status">Keep Firefox open while claims run.</div><progress id="progress" value="0" max="1"></progress><p id="error" role="alert"></p><button id="start" disabled>Checking…</button><button id="stop" class="secondary">Stop after this claim</button><button id="refresh" class="secondary">Refresh count</button></section>
<footer>Keep this phone unlocked with Firefox on screen. If Epic shows a security check, complete it, then return here and tap Continue. <a href="/pair">Reconnect helper</a></footer>
</main><script src="/phone/awake.js"></script><script>
(()=>{'use strict';const key='__PHONE_CONTROL_TOKEN__',el=id=>document.getElementById(id);let latest,starting=false,timer,auto=location.pathname==='/phone'||new URLSearchParams(location.search).get('launch')==='1',countdown=false;
history.replaceState(null,'','/phone');
async function api(route,method='GET'){const r=await fetch('/phone/control/'+route,{method,headers:{Authorization:'Bearer '+key},signal:AbortSignal.timeout(50000)});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Phone connection unavailable');return d}
async function beat(){if(document.visibilityState==='visible')await api('visible','POST').catch(()=>{})}
const time=value=>value?new Date(value).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
function render(d){latest=d;const b=d.batch||{},active=['preparing','running'].includes(b.state);el('count').textContent=d.pending;el('caption').textContent='claims remaining across '+d.accounts+' account'+(d.accounts===1?'':'s');el('games').replaceChildren(...d.games.map(g=>{const li=document.createElement('li'),name=document.createElement('span'),n=document.createElement('strong');name.textContent=g.title;n.textContent=g.count;li.append(name,n);return li}));el('connection').textContent=d.worker.ready?'Phone ready':active?'Claiming':'Phone not ready';el('progress').max=Math.max(1,b.total||0);el('progress').value=b.completed||0;el('stop').style.display=active?'block':'none';el('start').disabled=starting||active||!d.pending||!!d.rateLimitedUntil||!d.worker.ready;el('start').textContent=starting?'Starting claims…':active?'Queue is running':b.state==='paused'?'Continue claims':d.pending?'Claim '+d.pending+' games':'All caught up';
if(active)showRunning(d);else if(d.rateLimitedUntil)el('message').textContent='Epic cooldown until '+time(d.rateLimitedUntil)+'. Claims will wait.';else if(b.state==='paused')el('message').textContent=b.reason||'Claims paused. Complete any visible check, then continue.';else if(!d.pending)el('message').textContent='All available games have been claimed.';else if(!d.worker.ready)el('message').textContent=d.worker.reason||'Waiting for the helper. Keep this page open.';else el('message').textContent='Ready to claim with this phone.';
if(b.state==='paused')auto=false;
if(auto&&!active&&d.pending&&d.worker.ready&&!d.rateLimitedUntil&&!countdown){countdown=true;auto=false;let seconds=4;el('message').textContent='Starting '+d.pending+' claims in '+seconds+' seconds…';timer=setInterval(()=>{seconds--;if(!seconds){clearInterval(timer);start()}else el('message').textContent='Starting '+d.pending+' claims in '+seconds+' seconds…'},1000)}else if(active||!d.pending||d.rateLimitedUntil)auto=false;
}
function showRunning(d){
 const b=d.batch||{},seconds=Math.max(0,Math.ceil((Date.parse(d.nextCheckoutAt)-Date.now())/1000));
 const progress=(b.completed||0)+' of '+b.total+' finished. ';
 el('connection').textContent=seconds?'Waiting between claims':'Queue running';
 el('message').textContent=progress+(seconds?'Next checkout in '+Math.floor(seconds/60)+'m '+String(seconds%60).padStart(2,'0')+'s. Keep Firefox open.':d.worker.ready?'Preparing the next claim. Epic will open automatically within 30 seconds.':'Opening Epic checkout. Keep this page open; the helper can take up to 30 seconds.');
}
setInterval(()=>{if(latest&&['preparing','running'].includes(latest.batch?.state)&&!starting&&!countdown)showRunning(latest)},1000);
async function refresh(){try{await beat();const d=await api('status');el('error').textContent='';render(d)}catch(e){el('error').textContent=e.message;el('connection').textContent='Disconnected';el('start').disabled=true}}
async function start(){if(starting)return;clearInterval(timer);countdown=false;auto=false;starting=true;el('start').disabled=true;el('start').textContent='Starting claims…';el('connection').textContent='Starting';el('message').textContent='Starting the queue. Epic checkout will open automatically; this can take up to 30 seconds.';el('error').textContent='';try{await beat();render(await api('start','POST'))}catch(e){el('error').textContent=e.message}finally{starting=false;await refresh()}}
el('start').onclick=start;el('refresh').onclick=refresh;el('stop').onclick=async()=>{auto=false;clearInterval(timer);try{await api('stop','POST');el('message').textContent='Stopping after the current claim.'}catch(e){el('error').textContent=e.message}};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});beat();refresh();setInterval(beat,5000);setInterval(()=>{if(document.visibilityState==='visible'&&!starting&&!countdown)refresh()},10000);
})();</script></body></html>
