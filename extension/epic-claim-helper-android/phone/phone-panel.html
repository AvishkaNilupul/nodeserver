<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820"><title>Epic Claims</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#eff5f7;font:18px system-ui,sans-serif}main{max-width:650px;margin:auto;padding:32px 24px 64px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:29px;margin:12px 0 28px}small,.muted{color:#a7bac4}#count{font-size:76px;font-weight:750;letter-spacing:-4px;line-height:1.1}.card{background:#192731;border:1px solid #31444f;border-radius:20px;padding:26px;margin:18px 0}.caption{margin-top:7px;color:#b9cbd2}#games{list-style:none;padding:0;margin:24px 0 0}#games li{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #31444f;padding:14px 0}button{width:100%;border:0;border-radius:13px;padding:17px;margin:8px 0;font:inherit;font-weight:700;background:#a8f0c5;color:#10291b;cursor:pointer}button:disabled{opacity:.45;cursor:default}.secondary{background:#253b48;color:#eff5f7}#message{line-height:1.6;min-height:56px}progress{width:100%;height:10px;accent-color:#a8f0c5}#stop{display:none}a{color:#a8f0c5}#connection{font-size:13px}#error{color:#ffb9a5;line-height:1.5}footer{font-size:14px;line-height:1.7;color:#a7bac4;margin-top:22px}
</style></head><body><main><header><h1>Epic Claims</h1><span id="connection">Connecting</span></header>
<section class="card"><div id="count">—</div><div class="caption" id="caption">Checking remaining claims</div><ul id="games"></ul></section>
<section class="card"><div id="message" role="status">Keep Firefox open while claims run.</div><progress id="progress" value="0" max="1"></progress><p id="error" role="alert"></p><button id="start" disabled>Checking…</button><button id="stop" class="secondary">Stop after this claim</button><button id="refresh" class="secondary">Refresh count</button></section>
<footer>Keep this phone unlocked with Firefox on screen. <a href="/pair">Reconnect helper</a></footer>
</main><script src="/phone/awake.js"></script><script>
(()=>{'use strict';const key='__PHONE_CONTROL_TOKEN__',el=id=>document.getElementById(id);let latest,statusNotBefore=0,starting=false,timer,auto=location.pathname==='/phone'||new URLSearchParams(location.search).get('launch')==='1',countdown=false;
history.replaceState(null,'',location.pathname);
async function api(route,method='GET'){const r=await fetch('/phone/control/'+route,{method,headers:{Authorization:'Bearer '+key},signal:AbortSignal.timeout(50000)});const d=await r.json();if(r.status===429&&route==='status')statusNotBefore=Date.now()+Math.max(60,Number(d.retryAfterSeconds)||60)*1000;if(!r.ok||!d.success)throw Error(d.message||'Phone connection unavailable');return d}
async function beat(){if(document.visibilityState==='visible')await api('visible','POST').catch(()=>{})}
const time=value=>value?new Date(value).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
function cancelCountdown(){
 clearInterval(timer);
 countdown=false;
}
function render(d){
 latest=d;
 const b=d.batch||{}, active=['preparing','running'].includes(b.state), paused=b.state==='paused';
 const startButton=el('start'), message=el('message'), connection=el('connection');
 el('count').textContent=d.pending;
 el('caption').textContent='claims remaining across '+d.accounts+' account'+(d.accounts===1?'':'s');
 el('games').replaceChildren(...d.games.map(game=>{
  const row=document.createElement('li'), name=document.createElement('span'), count=document.createElement('strong');
  name.textContent=game.title; count.textContent=game.count; row.append(name,count);
  return row;
 }));
 el('progress').max=Math.max(1,b.total||0);
 el('progress').value=b.completed||0;
 el('stop').style.display=active?'block':'none';
 connection.textContent=d.worker.ready?'Phone ready':active?'Claiming':'Phone not ready';
 startButton.disabled=starting||active||!d.pending||!!d.rateLimitedUntil||!d.worker.ready;
 startButton.textContent=starting?'Starting claims…':active?'Queue is running':
  !d.pending?'All caught up':paused?'Continue claims':'Claim '+d.pending+' games';

 if(active){
  showRunning(d);
 }else if(d.rateLimitedUntil){
  message.textContent='Epic cooldown until '+time(d.rateLimitedUntil)+'. Claims will wait.';
 }else if(paused && b.current){
  // Only a needs_captcha job retains a current game in a paused phone API snapshot.
  connection.textContent='Security check';
  message.textContent='Epic requested verification for '+b.current+'. This attempt ended. Review the checkout in Firefox and check the account’s library before starting a new run.';
  if(d.pending)startButton.textContent='Start a new run';
 }else if(paused){
  message.textContent=b.reason||'Claims paused.';
 }else if(!d.pending){
  message.textContent='All available games have been claimed.';
 }else if(!d.worker.ready){
  message.textContent=d.worker.reason||'Waiting for the helper. Keep this page open.';
 }else{
  message.textContent='Ready to claim with this phone.';
 }

 if(paused||active||!d.pending||d.rateLimitedUntil)auto=false;
 if(startButton.disabled||paused||document.visibilityState!=='visible'){
  cancelCountdown();
  return;
 }
 if(!auto||countdown)return;
 auto=false;
 countdown=true;
 let seconds=4;
 const remaining=()=>{message.textContent='Starting '+d.pending+' claims in '+seconds+' seconds…'};
 remaining();
 timer=setInterval(()=>{
  if(!countdown||document.visibilityState!=='visible'){cancelCountdown();return}
  if(--seconds>0){remaining();return}
  start();
 },1000);
}
function showRunning(d){
 const b=d.batch||{},seconds=Math.max(0,Math.ceil((Date.parse(d.nextCheckoutAt)-Date.now())/1000));
 const progress=(b.completed||0)+' of '+b.total+' finished. ';
 el('connection').textContent=seconds?'Waiting between claims':'Queue running';
 el('message').textContent=progress+(seconds?'Next checkout in '+Math.floor(seconds/60)+'m '+String(seconds%60).padStart(2,'0')+'s. Keep Firefox open.':d.worker.ready?'Preparing the next claim. Epic will open automatically within 5 seconds.':'Opening Epic checkout. Keep this page open; the helper can take up to 5 seconds.');
}
setInterval(()=>{if(latest&&['preparing','running'].includes(latest.batch?.state)&&!starting&&!countdown)showRunning(latest)},1000);
let refreshGeneration=0;
async function refresh(){
 if(Date.now()<statusNotBefore)return;
 if(countdown)cancelCountdown();
 const generation=++refreshGeneration;
 try{
  await beat();
  const d=await api('status');
  if(generation!==refreshGeneration)return;
  el('error').textContent='';render(d);
 }catch(e){
  if(generation!==refreshGeneration)return;
  cancelCountdown();auto=false;latest=null;
  el('error').textContent=e.message;el('connection').textContent=Date.now()<statusNotBefore?'Status delayed':'Disconnected';el('start').disabled=true;
 }
}
async function start(){if(starting)return;cancelCountdown();auto=false;starting=true;el('start').disabled=true;el('start').textContent='Starting claims…';el('connection').textContent='Starting';el('message').textContent='Starting the queue. Epic checkout will open automatically; this can take up to 5 seconds.';el('error').textContent='';try{await beat();render(await api('start','POST'))}catch(e){el('error').textContent=e.message}finally{starting=false;await refresh()}}
el('start').onclick=start;el('refresh').onclick=refresh;el('stop').onclick=async()=>{auto=false;cancelCountdown();try{await api('stop','POST');el('message').textContent='Stopping after the current claim.'}catch(e){el('error').textContent=e.message}};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh();else cancelCountdown()});beat();refresh();setInterval(beat,5000);setInterval(()=>{if(document.visibilityState==='visible'&&!starting&&!countdown)refresh()},30000);
})();</script></body></html>
