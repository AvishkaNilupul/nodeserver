<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>News Feed · Preview</title>
  <style>
    :root {
      --bg: #0b0b12;
      --panel: #14141f;
      --panel-2: #1b1b2a;
      --border: #262638;
      --border-hi: #333350;
      --text: #e9e9f4;
      --muted: #8a8aa8;
      --brand: #7c7cf5;
      --brand-2: #a6a6ff;
      --free: #4ade80;
      --drops: #fbbf24;
      --deal: #38bdf8;
      --other: #64748b;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 14px; }
    a { color: var(--brand-2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font-family: inherit; }
    input { font-family: inherit; }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 64px; }

    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
    h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
    .subtitle { color: var(--muted); font-size: 12px; }
    .status { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--free); margin-right: 6px; vertical-align: middle; }
    .status.error .dot { background: var(--danger); }

    .sources {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin: 16px 0;
      font-size: 12px;
      color: var(--muted);
      display: flex; flex-wrap: wrap; gap: 14px;
    }
    .sources .src { display: inline-flex; align-items: center; gap: 6px; }
    .sources .ok { color: var(--free); }
    .sources .err { color: var(--danger); }

    .filters {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
    .filter-row:last-child { margin-bottom: 0; }
    .filter-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; min-width: 74px; }

    .chip {
      padding: 5px 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.12s;
    }
    .chip:hover { color: var(--text); border-color: var(--border-hi); }
    .chip.active { background: var(--brand); border-color: var(--brand); color: white; }
    .chip .n { opacity: 0.7; margin-left: 4px; font-size: 10px; }

    .search-row { display: flex; gap: 8px; align-items: center; }
    .search-row input {
      flex: 1;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .search-row input:focus { outline: none; border-color: var(--brand); }
    .sort-select {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .result-count { color: var(--muted); font-size: 12px; margin: 12px 0; }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex; gap: 14px;
    }
    .card:hover { border-color: var(--border-hi); }
    .card .thumb {
      width: 90px; height: 90px; flex-shrink: 0;
      border-radius: 8px;
      background: var(--panel-2);
      background-size: cover;
      background-position: center;
    }
    .card .body { flex: 1; min-width: 0; }
    .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
    .card-head .author { color: var(--text); font-weight: 500; }
    .card-head .badge {
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge.free  { background: rgba(74, 222, 128, 0.15); color: var(--free); }
    .badge.drops { background: rgba(251, 191, 36, 0.15); color: var(--drops); }
    .badge.deal  { background: rgba(56, 189, 248, 0.15); color: var(--deal); }
    .badge.other { background: rgba(100, 116, 139, 0.2); color: var(--other); }
    .badge.src   { background: var(--panel-2); color: var(--muted); }
    .badge.store { background: rgba(124, 124, 245, 0.15); color: var(--brand-2); text-transform: none; letter-spacing: 0; }
    .badge.plat  { background: rgba(100, 116, 139, 0.15); color: var(--muted); text-transform: uppercase; }
    .badge.farm  { background: rgba(124, 124, 245, 0.25); color: #fff; text-transform: none; letter-spacing: 0; }
    .card.farmable { border-color: var(--brand); box-shadow: 0 0 0 1px rgba(124, 124, 245, 0.35); }

    .view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .view-toggle button { background: var(--panel-2); color: var(--muted); border: none; padding: 6px 12px; font-size: 12px; cursor: pointer; }
    .view-toggle button.active { background: var(--brand); color: white; }

    /* Gallery mode */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .gallery .card {
      flex-direction: column;
      padding: 0;
      overflow: hidden;
      gap: 0;
    }
    .gallery .card .thumb {
      width: 100%;
      height: 130px;
      border-radius: 0;
    }
    .gallery .card .no-thumb { width: 100%; height: 130px; background: linear-gradient(135deg, var(--panel-2), var(--panel)); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; }
    .gallery .card .body { padding: 12px 14px; }
    .gallery .card-head { font-size: 11px; }
    .gallery .card-title { font-size: 13px; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .gallery .card-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12px; }
    .gallery .card-urls { display: none; }

    .card-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; word-break: break-word; }
    .card-text { font-size: 13px; line-height: 1.45; color: #c9c9d8; white-space: pre-wrap; word-break: break-word; }
    .card-urls { margin-top: 8px; }
    .card-urls a { display: inline-block; padding: 3px 8px; background: var(--panel-2); border-radius: 4px; margin-right: 6px; margin-bottom: 4px; color: var(--brand-2); font-size: 11px; }
    .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 11px; color: var(--muted); gap: 8px; }
    .metrics span { margin-right: 10px; }

    .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
    .error-box {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: var(--danger);
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>News Feed · Preview</h1>
        <div class="subtitle">Free games · Twitch drops · Deals — cross-source</div>
      </div>
      <div id="status" class="status"><span class="dot"></span><span id="statusText">loading…</span></div>
    </header>

    <div id="sources" class="sources">loading sources…</div>

    <div class="filters">
      <div class="filter-row">
        <span class="filter-label">Kind</span>
        <div id="f-kind" class="chip-group"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Source</span>
        <div id="f-source" class="chip-group"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Store</span>
        <div id="f-store" class="chip-group"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Platform</span>
        <div id="f-platform" class="chip-group"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Freshness</span>
        <div id="f-fresh" class="chip-group"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Farming</span>
        <div id="f-farm" class="chip-group"></div>
      </div>
      <div class="filter-row search-row">
        <input id="search" type="text" placeholder="Search title, text, store, tags…" />
        <select id="sort" class="sort-select">
          <option value="newest">Sort: Newest</option>
          <option value="engaged">Sort: Most engaged</option>
          <option value="farmable">Sort: Farmable first</option>
        </select>
        <div class="view-toggle">
          <button id="view-list" class="active">List</button>
          <button id="view-gallery">Gallery</button>
        </div>
      </div>
    </div>

    <div id="resultCount" class="result-count"></div>
    <div id="feed"></div>
  </div>

  <script>
    const FILTERS = {
      kind:     { key: 'kind',     options: ['all','free','drops','deal','other'], selected: new Set(['all']), multi: true, mode: 'value' },
      source:   { key: 'source',   options: ['all','x','reddit','epic','cheapshark'], selected: new Set(['all']), multi: true, mode: 'value' },
      store:    { key: 'store',    options: ['all'], selected: new Set(['all']), multi: true, mode: 'value' },
      platform: { key: 'platform', options: ['all'], selected: new Set(['all']), multi: true, mode: 'array' },
      fresh:    { key: 'fresh',    options: ['all','1h','24h','7d'], selected: new Set(['all']), multi: false, mode: 'freshness' },
      farm:     { key: 'farm',     options: ['all','farmable'], selected: new Set(['all']), multi: false, mode: 'farm' },
    };
    let currentData = null;
    let searchText = '';
    let sortMode = 'newest';
    let viewMode = 'list';

    function renderChips(id, filter, counts) {
      const el = document.getElementById(id);
      el.innerHTML = '';
      for (const opt of filter.options) {
        const b = document.createElement('button');
        const n = counts && opt !== 'all' ? (counts[opt] || 0) : null;
        b.className = 'chip' + (filter.selected.has(opt) ? ' active' : '');
        b.textContent = opt;
        if (n !== null) {
          const s = document.createElement('span');
          s.className = 'n';
          s.textContent = n;
          b.appendChild(s);
        }
        b.addEventListener('click', () => toggleChip(filter, opt));
        el.appendChild(b);
      }
    }

    function toggleChip(filter, opt) {
      if (opt === 'all') { filter.selected = new Set(['all']); }
      else {
        filter.selected.delete('all');
        if (!filter.multi) filter.selected = new Set([opt]);
        else if (filter.selected.has(opt)) filter.selected.delete(opt);
        else filter.selected.add(opt);
        if (filter.selected.size === 0) filter.selected = new Set(['all']);
      }
      render();
    }

    function matchesFreshness(item, opt) {
      if (opt === 'all') return true;
      const t = new Date(item.createdAt).getTime();
      const ago = Date.now() - t;
      if (opt === '1h')  return ago <= 3600_000;
      if (opt === '24h') return ago <= 86400_000;
      if (opt === '7d')  return ago <= 7 * 86400_000;
      return true;
    }

    function matchesFilter(item, filter) {
      if (filter.selected.has('all')) return true;
      const sel = [...filter.selected];
      if (filter.mode === 'freshness') return matchesFreshness(item, sel[0]);
      if (filter.mode === 'farm') return Boolean(item.farmable);
      const val = item[filter.key];
      if (Array.isArray(val)) return sel.some(s => val.includes(s));
      if (val == null) return false;
      return sel.includes(val);
    }

    function matchesSearch(item, q) {
      if (!q) return true;
      const hay = `${item.title || ''} ${item.text || ''} ${item.sourceHandle || ''} ${(item.store || '')} ${(item.platform || []).join(' ')}`.toLowerCase();
      return hay.includes(q.toLowerCase());
    }

    function timeAgo(iso) {
      const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      if (s < 60) return `${s}s ago`;
      if (s < 3600) return `${Math.floor(s/60)}m ago`;
      if (s < 86400) return `${Math.floor(s/3600)}h ago`;
      return `${Math.floor(s/86400)}d ago`;
    }

    function engagement(item) {
      const m = item.metrics || {};
      return (m.likes || 0) + (m.retweets || 0) * 2 + (m.upvotes || 0) + (m.comments || 0) / 2;
    }

    function computeStoreOptions(items) {
      const set = new Set();
      for (const i of items) if (i.store) set.add(i.store);
      return ['all', ...[...set].sort()];
    }
    function computePlatformOptions(items) {
      const set = new Set();
      for (const i of items) for (const p of (i.platform || [])) set.add(p);
      return ['all', ...[...set].sort()];
    }

    function countsFor(items, key, mode) {
      const counts = {};
      for (const i of items) {
        if (mode === 'array') for (const v of (i[key] || [])) counts[v] = (counts[v] || 0) + 1;
        else if (i[key] != null) counts[i[key]] = (counts[i[key]] || 0) + 1;
      }
      return counts;
    }

    function render() {
      if (!currentData) return;
      const { items, sources, fetchedAt, xRateLimit } = currentData;

      const anyError = sources.some(s => s.errors && s.errors.length);
      const status = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      status.className = 'status' + (anyError ? ' error' : '');
      const rl = xRateLimit ? ` · x rate ${xRateLimit.remaining}/${xRateLimit.limit}` : '';
      statusText.textContent = `${items.length} items · updated ${timeAgo(fetchedAt)}${rl}`;

      // Source health strip — collapse many-handle errors into a count + tooltip
      document.getElementById('sources').innerHTML = sources.map(s => {
        const n = (s.errors || []).length;
        let errLabel = '';
        if (n === 1) errLabel = `<span class="err" title="${esc(s.errors[0].handle + ': ' + s.errors[0].error)}"> · ${esc(s.errors[0].handle)} err</span>`;
        else if (n > 1) {
          const sample = s.errors[0];
          const tip = s.errors.map(e => `${e.handle}: ${e.error}`).join('\n');
          errLabel = `<span class="err" title="${esc(tip)}"> · ${n} errs (${esc(sample.error.slice(0, 30))})</span>`;
        }
        return `<span class="src">
          <span class="${n ? 'err' : 'ok'}">●</span>
          <b style="color:var(--text)">${s.name}</b>
          · ${s.count} items · ${timeAgo(s.fetchedAt)}${s.cached ? ' (cache)' : ''}${errLabel}
        </span>`;
      }).join('');

      // Dynamic option sets (store/platform) come from actual data
      FILTERS.store.options = computeStoreOptions(items);
      FILTERS.platform.options = computePlatformOptions(items);
      for (const s of [...FILTERS.store.selected]) if (!FILTERS.store.options.includes(s)) FILTERS.store.selected.delete(s);
      for (const s of [...FILTERS.platform.selected]) if (!FILTERS.platform.options.includes(s)) FILTERS.platform.selected.delete(s);
      if (!FILTERS.store.selected.size) FILTERS.store.selected = new Set(['all']);
      if (!FILTERS.platform.selected.size) FILTERS.platform.selected = new Set(['all']);

      renderChips('f-kind',     FILTERS.kind,     countsFor(items, 'kind', 'value'));
      renderChips('f-source',   FILTERS.source,   countsFor(items, 'source', 'value'));
      renderChips('f-store',    FILTERS.store,    countsFor(items, 'store', 'value'));
      renderChips('f-platform', FILTERS.platform, countsFor(items, 'platform', 'array'));
      renderChips('f-fresh',    FILTERS.fresh,    null);
      const farmableCount = items.filter(i => i.farmable).length;
      renderChips('f-farm',     FILTERS.farm,     { farmable: farmableCount });

      let filtered = items.filter(i =>
        matchesFilter(i, FILTERS.kind) &&
        matchesFilter(i, FILTERS.source) &&
        matchesFilter(i, FILTERS.store) &&
        matchesFilter(i, FILTERS.platform) &&
        matchesFilter(i, FILTERS.fresh) &&
        matchesFilter(i, FILTERS.farm) &&
        matchesSearch(i, searchText)
      );

      if (sortMode === 'engaged') filtered.sort((a, b) => engagement(b) - engagement(a));
      if (sortMode === 'farmable') filtered.sort((a, b) => (b.farmable ? 1 : 0) - (a.farmable ? 1 : 0));

      document.getElementById('resultCount').textContent =
        `${filtered.length} of ${items.length} items`;

      const feed = document.getElementById('feed');
      feed.className = viewMode === 'gallery' ? 'gallery' : '';
      if (!filtered.length) { feed.innerHTML = '<div class="empty">No items match these filters.</div>'; return; }
      feed.innerHTML = filtered.slice(0, 200).map(item => card(item)).join('');
    }

    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    function linkify(text) {
      return esc(text).replace(/(https?:\/\/[^\s]+)/g, u =>
        `<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//, '').slice(0,60)}</a>`
      );
    }

    function card(item) {
      const thumb = item.media && item.media[0] && item.media[0].url;
      const store = item.store ? `<span class="badge store">${item.store}</span>` : '';
      const plats = (item.platform || []).map(p => `<span class="badge plat">${p}</span>`).join('');
      const farm = item.farmable ? `<span class="badge farm">🎯 ${esc(item.farmable)}</span>` : '';
      const urls = (item.urls || []).slice(0, 4).map(u =>
        `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//, '').slice(0, 55))}</a>`
      ).join('');
      const m = item.metrics || {};
      const metrics = [
        m.likes ? `♥ ${m.likes}` : '',
        m.retweets ? `↻ ${m.retweets}` : '',
        m.upvotes ? `▲ ${m.upvotes}` : '',
        m.comments ? `💬 ${m.comments}` : '',
      ].filter(Boolean).map(s => `<span>${s}</span>`).join('');

      const thumbEl = thumb
        ? `<div class="thumb" style="background-image:url(${esc(thumb)})"></div>`
        : (viewMode === 'gallery' ? `<div class="no-thumb">${esc(item.source)}</div>` : '');

      return `<div class="card${item.farmable ? ' farmable' : ''}">
        ${thumbEl}
        <div class="body">
          <div class="card-head">
            <span class="author">${esc(item.author)}</span>
            <span>· ${esc(item.sourceHandle)}</span>
            <span>· ${timeAgo(item.createdAt)}</span>
            <span class="badge ${item.kind}">${item.kind}</span>
            <span class="badge src">${item.source}</span>
            ${store}
            ${plats}
            ${farm}
          </div>
          ${item.title ? `<div class="card-title">${esc(item.title)}</div>` : ''}
          ${item.text ? `<div class="card-text">${linkify(item.text)}</div>` : ''}
          ${urls ? `<div class="card-urls">${urls}</div>` : ''}
          <div class="card-foot">
            <div class="metrics">${metrics}</div>
            ${item.postUrl ? `<a href="${esc(item.postUrl)}" target="_blank" rel="noopener">open source →</a>` : ''}
          </div>
        </div>
      </div>`;
    }

    async function refresh() {
      try {
        const res = await fetch('/api/news');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        currentData = await res.json();
        render();
      } catch (err) {
        document.getElementById('feed').innerHTML =
          `<div class="error-box">Failed to load: ${err.message}</div>`;
      }
    }

    document.getElementById('search').addEventListener('input', e => { searchText = e.target.value; render(); });
    document.getElementById('sort').addEventListener('change', e => { sortMode = e.target.value; render(); });
    document.getElementById('view-list').addEventListener('click', () => {
      viewMode = 'list';
      document.getElementById('view-list').classList.add('active');
      document.getElementById('view-gallery').classList.remove('active');
      render();
    });
    document.getElementById('view-gallery').addEventListener('click', () => {
      viewMode = 'gallery';
      document.getElementById('view-gallery').classList.add('active');
      document.getElementById('view-list').classList.remove('active');
      render();
    });

    refresh();
    setInterval(refresh, 30_000);
  </script>
</body>
</html>
